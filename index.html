<style>
:root{
  --ink:#1E2E29; --ink-2:#243A31;
  --paper:#F3E9D2; --paper-2:#EADFC0;
  --brass:#1F7A4D; --brass-2:#4FCB8C;
  --debt:#A6432E; --debt-soft:#F0DACD; --debt-onink:#E38468;
  --paid:#3D6B52; --paid-soft:#DCE7DE; --paid-onink:#83C99C;
  --ink-text:#2A2118; --muted-ink:#8C7F63;
  --cream:#F1E9D6; --muted-cream:#B9C6BD;
  --border:rgba(42,33,24,.16);
  --whatsapp:#2E9E5B;
  --hero-overlay-bg:rgba(241,233,214,.08);
  --hero-overlay-bg-hover:rgba(241,233,214,.15);
  --hero-overlay-border:rgba(241,233,214,.16);
  --hero-overlay-border-2:rgba(241,233,214,.18);
  --heading-font:'Amiri',serif;
  --pin-color:#1F7A4D;
  --tap-min:40px;
}
body.theme-light{
  --ink:#F7F1E1; --ink-2:#EFE6CB;
  --paper:#FFFFFF; --paper-2:#F4EFE0;
  --cream:#2A2118; --muted-cream:#6B5E45;
  --brass-2:#146138;
  --border:rgba(42,33,24,.12);
  --hero-overlay-bg:rgba(42,33,24,.045);
  --hero-overlay-bg-hover:rgba(42,33,24,.09);
  --hero-overlay-border:rgba(42,33,24,.13);
  --hero-overlay-border-2:rgba(42,33,24,.13);
}
body.lang-en{ --heading-font:Georgia,'Times New Roman',serif; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--ink);font-family:'Cairo',sans-serif;color:var(--ink-text);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .25s ease;}
button,input,textarea,select{font-family:inherit;}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
#app{min-height:100vh;}
.shell{background:var(--paper);min-height:100vh;max-width:480px;margin:0 auto;overflow:hidden;animation:riseIn .35s ease;}
.shell.view-list .detail-panel{display:none;}
.shell.view-person .list-panel{display:none;}
@media(min-width:640px){
  body{padding:32px 16px;}
  .shell{min-height:auto;border-radius:20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.55),0 0 0 1px rgba(31,122,77,.15);}
}
@media(min-width:860px){
  body{padding:clamp(28px,3vw,56px) clamp(16px,2.5vw,40px);}
  .shell{max-width:min(1600px,94vw);width:100%;display:flex;align-items:stretch;min-height:600px;max-height:calc(100vh - 80px);}
  .list-panel{width:clamp(340px,27vw,440px);flex-shrink:0;border-left:1px solid var(--border);overflow-y:auto;}
  .detail-panel{flex:1;min-width:0;overflow-y:auto;}
  .shell.view-list .detail-panel,.shell.view-person .list-panel{display:block;}
  .back-btn{display:none;}
}
@keyframes riseIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){.shell,.modal{animation:none !important;}}

.hero{background:linear-gradient(180deg,var(--ink) 0%,var(--ink-2) 100%);color:var(--cream);padding:22px 20px 20px;transition:background .25s ease;}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px;}
.brand{font-family:var(--heading-font);font-weight:700;font-size:25px;margin:0;color:var(--brass-2);letter-spacing:.2px;}
.hero-top-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.icon-btn{background:var(--hero-overlay-bg);border:1px solid var(--hero-overlay-border);color:var(--cream);width:var(--tap-min);height:var(--tap-min);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.icon-btn:hover{background:var(--hero-overlay-bg-hover);}
.icon-btn.active-toggle{background:var(--brass);border-color:var(--brass);color:#fff;}
.hero-total-label{display:block;font-size:12.5px;color:var(--muted-cream);margin-bottom:4px;}
.hero-total-value{font-size:32px;font-weight:800;color:var(--brass-2);letter-spacing:.2px;}
.hero-total-value small{font-size:15px;font-weight:600;color:var(--muted-cream);margin-right:4px;margin-left:4px;}
.hero-total-value.masked{filter:none;letter-spacing:2px;}
.hero-sub-totals{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;}
.hero-sub-total{font-size:12.5px;color:var(--muted-cream);}
.hero-sub-total b{color:var(--cream);font-weight:700;}
.hero-meta{font-size:12px;color:var(--muted-cream);margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.archive-pill{background:var(--hero-overlay-bg);border:1px solid var(--hero-overlay-border);color:var(--brass-2);font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;cursor:pointer;}

.banner{margin:0 20px 0;padding:11px 14px;border-radius:10px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper-2);color:var(--ink-text);border:1px solid var(--border);}
.banner.archive-banner{background:var(--brass);color:#fff;border-color:var(--brass);margin:14px 20px 0;}
.banner-actions{display:flex;gap:6px;flex-shrink:0;}
.banner-link{background:none;border:none;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;font-size:12.5px;padding:2px;}
.banner-close{background:none;border:none;color:inherit;font-size:16px;cursor:pointer;padding:0 2px;line-height:1;opacity:.8;}

.toolbar{padding:16px 20px 2px;background:var(--paper);}
.search-wrap{position:relative;margin-bottom:10px;}
.search-wrap svg{position:absolute;top:50%;right:13px;transform:translateY(-50%);color:var(--muted-ink);pointer-events:none;}
.search-wrap input{width:100%;padding:11px 40px 11px 14px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:14.5px;color:var(--ink-text);outline:none;}
.search-wrap input:focus{border-color:var(--brass);box-shadow:0 0 0 3px rgba(31,122,77,.18);}
.toolbar-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.sort-group{display:flex;gap:6px;flex-wrap:wrap;}
.chip{border:1px solid var(--border);background:transparent;color:var(--muted-ink);font-size:12.5px;padding:7px 12px;border-radius:999px;cursor:pointer;min-height:32px;}
.chip.active{background:var(--ink);color:var(--brass-2);border-color:var(--ink);}
.btn-brass{background:var(--brass);color:#fff;border:none;font-weight:700;font-size:13.5px;padding:10px 16px;border-radius:10px;cursor:pointer;white-space:nowrap;min-height:var(--tap-min);}
.btn-brass:hover{background:#a3771f;}
.btn-brass:disabled{opacity:.55;cursor:not-allowed;}

.list{padding:2px 14px 24px;}
.person-row{display:flex;align-items:center;gap:8px;padding:14px 8px;border-bottom:1px solid var(--border);cursor:pointer;}
.person-row:last-child{border-bottom:none;}
.person-row.pinned{background:rgba(31,122,77,.06);}
.pin-flag{color:var(--pin-color);flex-shrink:0;display:flex;}
.person-row-main{flex:1;min-width:0;}
.person-name-line{display:flex;align-items:center;gap:6px;}
.person-name{font-weight:700;font-size:15.5px;color:var(--ink-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.person-phone{font-size:12.5px;color:var(--muted-ink);margin-top:2px;}
.person-currency-tag{font-size:10.5px;font-weight:700;color:var(--brass);background:var(--paper-2);padding:1px 6px;border-radius:6px;flex-shrink:0;}
.person-row-amount{font-weight:700;font-size:13.5px;white-space:nowrap;text-align:left;}
.text-debt{color:var(--debt);}
.text-paid{color:var(--paid);}
.text-muted{color:var(--muted-ink);}
.settled{background:var(--paid-soft);color:var(--paid);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;}
.person-row-actions{display:flex;gap:4px;}
.icon-btn-sm{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--muted-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.icon-btn-sm.danger{color:var(--debt);}
.icon-btn-sm.active{color:var(--pin-color);background:var(--debt-soft);border-color:transparent;}
.icon-btn-sm:hover{background:var(--paper-2);}

.masked-amount{letter-spacing:1px;}

.empty-state{text-align:center;padding:56px 24px;color:var(--muted-ink);}
.empty-state h3{font-family:var(--heading-font);color:var(--ink-text);font-size:19px;margin:0 0 6px;}
.empty-state p{font-size:13.5px;margin:0 0 18px;line-height:1.6;}
.detail-empty{height:100%;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;color:var(--muted-ink);background:var(--paper);}
.detail-empty h3{font-family:var(--heading-font);color:var(--ink-text);font-size:19px;margin:0 0 6px;}
.detail-empty p{font-size:13.5px;margin:0;line-height:1.6;max-width:280px;}

.person-hero{padding-bottom:22px;}
.back-btn{background:none;border:none;color:var(--muted-cream);font-size:13.5px;display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 0;margin-bottom:12px;min-height:32px;}
.person-hero-name-row{display:flex;align-items:center;gap:8px;}
.person-hero-name{font-family:var(--heading-font);font-size:23px;font-weight:700;color:var(--cream);}
.person-hero-phone{font-size:13px;color:var(--muted-cream);margin-top:3px;}
.person-hero-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.dir-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--hero-overlay-bg);border:1px solid var(--hero-overlay-border);color:var(--brass-2);}
.person-hero-total{font-size:36px;font-weight:800;margin-top:16px;}
.person-hero-total.text-debt{color:var(--debt-onink);}
.person-hero-total.text-paid{color:var(--paid-onink);}
.person-hero-total.text-muted{color:var(--muted-cream);}
.person-hero-total small{font-size:15px;font-weight:600;opacity:.75;margin-right:4px;margin-left:4px;}
.person-hero-total-label{font-size:12.5px;color:var(--muted-cream);margin-top:2px;}
.person-hero-extra{font-size:12px;color:var(--muted-cream);margin-top:6px;}
.person-hero-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
.person-hero-actions.secondary{margin-top:10px;}
.btn-debt,.btn-paid,.btn-ghost,.btn-danger,.btn-whatsapp,.btn-copy,.btn-share{font-weight:700;font-size:13.5px;padding:10px 14px;border-radius:10px;border:none;cursor:pointer;flex:1;text-align:center;min-height:var(--tap-min);}
.btn-debt{background:var(--debt);color:#fff;}
.btn-paid{background:var(--paid);color:#fff;}
.btn-ghost{background:var(--hero-overlay-bg);color:var(--cream);border:1px solid var(--hero-overlay-border-2);}
.person-hero-actions.secondary .icon-btn-sm{background:var(--hero-overlay-bg);border-color:var(--hero-overlay-border-2);color:var(--cream);flex:0 0 auto;width:var(--tap-min);height:var(--tap-min);}
.person-hero-actions.secondary .icon-btn-sm.danger{color:var(--debt-onink);}
.person-hero-actions.secondary .icon-btn-sm.active{color:var(--pin-color);background:rgba(31,122,77,.22);}

.entries-section{padding:18px 20px 30px;background:var(--paper);}
.entries-title{font-weight:700;font-size:14px;color:var(--ink-text);margin-bottom:10px;}
.entries-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.entry-row{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
.entry-row:last-child{border-bottom:none;}
.entry-date{width:96px;flex-shrink:0;font-size:11px;color:var(--muted-ink);line-height:1.5;padding-top:3px;}
.entry-main{flex:1;min-width:0;}
.entry-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:8px;margin-bottom:4px;}
.badge-debt{background:var(--debt-soft);color:var(--debt);}
.badge-paid{background:var(--paid-soft);color:var(--paid);}
.badge-installment{background:var(--paper-2);color:var(--brass);}
.entry-amount{font-weight:700;font-size:14px;}
.entry-note{font-size:12.5px;color:var(--muted-ink);margin-top:4px;line-height:1.5;}
.entry-due{margin-top:6px;}
.entry-receipt{margin-top:8px;}
.entry-receipt img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer;}
.entry-actions{display:flex;flex-direction:column;gap:5px;flex-shrink:0;}

.overlay{position:fixed;inset:0;background:rgba(22,36,31,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
@media(min-width:640px){.overlay{align-items:center;padding:20px;}}
.modal{background:var(--paper);width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:22px 20px 26px;position:relative;max-height:88vh;overflow-y:auto;animation:slideUp .25s ease;}
.modal.modal-wide{max-width:600px;}
@media(min-width:640px){.modal{border-radius:18px;}}
@keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:none;opacity:1;}}
.modal-close{position:absolute;top:14px;left:14px;background:none;border:none;font-size:22px;line-height:1;color:var(--muted-ink);cursor:pointer;width:36px;height:36px;}
.modal-title{font-family:var(--heading-font);font-size:19px;font-weight:700;margin:4px 34px 4px 0;color:var(--ink-text);}
.danger-title{color:var(--debt);}
.modal-text{font-size:13.5px;color:var(--muted-ink);line-height:1.6;margin:6px 0 16px;}
.modal-sub{font-size:12.5px;color:var(--muted-ink);margin:0 0 14px;}
.field-label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-text);margin:14px 0 6px;}
.field-hint{font-size:11.5px;color:var(--muted-ink);margin:5px 0 0;line-height:1.5;}
.modal input,.modal textarea,.modal select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:14.5px;color:var(--ink-text);outline:none;min-height:var(--tap-min);}
.modal textarea{resize:vertical;line-height:1.6;min-height:auto;}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--brass);box-shadow:0 0 0 3px rgba(31,122,77,.18);}
.field-row{display:flex;gap:10px;}
.field-row>div{flex:1;min-width:0;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions.column{flex-direction:column;}
.modal-actions button{flex:1;}
.btn-danger{background:var(--debt);color:#fff;}
.btn-whatsapp{background:var(--whatsapp);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-copy{background:var(--ink);color:var(--brass-2);display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-share{background:var(--paper-2);color:var(--ink-text);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px;}
.modal .btn-brass{width:100%;}
.modal .btn-ghost{background:#fff;color:var(--ink-text);border:1px solid var(--border);}
.modal .btn-ghost:hover{background:var(--paper-2);}
.modal-divider{border:none;border-top:1px solid var(--border);margin:20px 0;}
.settings-block .btn-ghost.full,.settings-block .btn-danger.full,.settings-block .btn-share.full{width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;}
.toggle-row .field-label{margin:0;}
.switch{position:relative;width:44px;height:26px;flex-shrink:0;}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
.switch-track{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:background .15s ease;pointer-events:none;}
.switch input:checked + .switch-track{background:var(--brass);}
.switch-thumb{position:absolute;top:3px;right:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .15s ease;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked ~ .switch-thumb{transform:translateX(-18px);}
html[dir="ltr"] .switch-thumb{right:auto;left:3px;}
html[dir="ltr"] .switch input:checked ~ .switch-thumb{transform:translateX(18px);}
.seg-group{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.seg-btn{flex:1;min-width:90px;border:1px solid var(--border);background:#fff;color:var(--ink-text);font-size:13px;font-weight:600;padding:9px 10px;border-radius:10px;cursor:pointer;min-height:var(--tap-min);}
.seg-btn.active{background:var(--ink);color:var(--brass-2);border-color:var(--ink);}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
.stat-card{background:var(--paper-2);border-radius:12px;padding:12px 14px;}
.stat-card-label{font-size:11.5px;color:var(--muted-ink);margin-bottom:4px;}
.stat-card-value{font-size:18px;font-weight:800;color:var(--ink-text);}
.stat-card.debt .stat-card-value{color:var(--debt);}
.stat-card.paid .stat-card-value{color:var(--paid);}
.report-list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.report-list-row:last-child{border-bottom:none;}
.report-rank{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--brass-2);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.report-list-main{flex:1;min-width:0;}
.report-list-name{font-weight:700;font-size:13.5px;color:var(--ink-text);}
.report-list-sub{font-size:11.5px;color:var(--muted-ink);margin-top:2px;}
.bar-track{background:var(--border);border-radius:999px;height:6px;margin-top:6px;overflow:hidden;}
.bar-fill{height:100%;background:var(--brass);border-radius:999px;}

.dues-section{padding:14px 20px 6px;background:var(--paper);border-bottom:1px solid var(--border);}
.due-row{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
.due-row:last-child{border-bottom:none;}
.due-main{flex:1;min-width:0;}
.due-name{font-weight:700;font-size:13.5px;color:var(--ink-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.due-note{font-size:11.5px;color:var(--muted-ink);margin-top:2px;}
.due-badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
.due-badge.overdue{background:var(--debt-soft);color:var(--debt);}
.due-badge.today{background:var(--brass);color:#fff;}
.due-badge.soon{background:rgba(31,122,77,.16);color:var(--brass);}
.due-badge.later{background:var(--paper-2);color:var(--muted-ink);}

.trend-section{padding:14px 20px 4px;background:var(--paper);}
.trend-title{font-weight:700;font-size:13px;color:var(--ink-text);margin-bottom:4px;}
.trend-chart{margin-bottom:6px;}
.trend-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted-ink);margin-top:2px;}

.recurring-section{padding:14px 20px;background:var(--paper);border-top:1px solid var(--border);}
.recurring-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px;flex-wrap:wrap;}
.recurring-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.recurring-row:last-child{border-bottom:none;}
.recurring-main{flex:1;min-width:0;}
.recurring-amount{font-weight:700;font-size:13.5px;color:var(--ink-text);}
.recurring-meta{font-size:11.5px;color:var(--muted-ink);margin-top:2px;}
.recurring-actions{display:flex;gap:4px;}

.lock-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:24px;}
.lock-card{background:var(--paper);border-radius:18px;padding:32px 26px;max-width:340px;width:100%;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.55);}
.lock-brand{font-family:var(--heading-font);font-size:26px;font-weight:700;color:var(--ink-text);margin-bottom:6px;}
.lock-sub{font-size:13px;color:var(--muted-ink);margin:0 0 18px;}
.lock-card input{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:14.5px;color:var(--ink-text);text-align:center;outline:none;min-height:var(--tap-min);}
.lock-card input:focus{border-color:var(--brass);box-shadow:0 0 0 3px rgba(31,122,77,.18);}
.lock-error{min-height:18px;color:var(--debt);font-size:12.5px;margin-top:8px;}
.lock-forgot{background:none;border:none;color:var(--muted-ink);font-size:12.5px;text-decoration:underline;cursor:pointer;margin-top:16px;padding:6px;min-height:var(--tap-min);}
.lock-biometric{margin-top:10px;width:100%;background:var(--ink);color:var(--brass-2);border:none;font-weight:700;font-size:13.5px;padding:11px 14px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap-min);}

.receipt-upload-row{display:flex;align-items:center;gap:10px;margin-top:6px;}
.receipt-preview{position:relative;width:64px;height:64px;flex-shrink:0;}
.receipt-preview img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--border);}
.receipt-remove{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--debt);color:#fff;border:2px solid var(--paper);font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.receipt-add-btn{border:1.5px dashed var(--border);background:transparent;color:var(--muted-ink);border-radius:10px;padding:10px 14px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:var(--tap-min);}

.image-viewer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
.image-viewer-overlay img{max-width:100%;max-height:100%;border-radius:8px;}
.image-viewer-close{position:absolute;top:18px;left:18px;background:rgba(255,255,255,.15);color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;}

.toast-banner{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--ink);color:var(--cream);padding:12px 22px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.55);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;max-width:88%;text-align:center;}
.toast-banner.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast-banner.error{background:var(--debt);}
.toast-banner.success{background:var(--paid);}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

@media(min-width:860px){
  .person-hero{padding-left:max(20px,calc((100% - 820px)/2));padding-right:max(20px,calc((100% - 820px)/2));}
  .entries-section{padding-left:max(20px,calc((100% - 820px)/2));padding-right:max(20px,calc((100% - 820px)/2));}
  .recurring-section{padding-left:max(20px,calc((100% - 820px)/2));padding-right:max(20px,calc((100% - 820px)/2));}
}

.print-sheet{display:none;}
@media print{
  body *{visibility:hidden;}
  #printSheet,#printSheet *{visibility:visible;}
  .print-sheet{display:block !important;position:absolute;top:0;right:0;width:100%;padding:16px;background:#fff;color:#111;}
  .print-header h1{font-family:var(--heading-font);font-size:20px;margin:0 0 2px;}
  .print-header h2{font-size:16px;margin:0 0 4px;}
  .print-header p{font-size:12px;color:#444;margin:0 0 14px;}
  .print-table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .print-table th,.print-table td{border:1px solid #ccc;padding:6px 8px;text-align:right;}
  .print-total{margin-top:16px;font-weight:700;font-size:14px;}
}

/* ===== Full-screen responsive layout — visual design unchanged ===== */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--gap-y:calc(var(--sat) + var(--sab));--gutter:20px;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{padding:var(--sat) var(--sar) var(--sab) var(--sal);min-height:100vh;min-height:100dvh;}
img{max-width:100%;}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
#app{min-height:0;}
.shell{max-width:none;width:100%;margin:0;border-radius:0;box-shadow:none;min-height:calc(100vh - var(--gap-y));min-height:calc(100dvh - var(--gap-y));}
.lock-screen,.loading-screen{min-height:calc(100vh - var(--gap-y));min-height:calc(100dvh - var(--gap-y));}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted-cream);font-size:14px;}
.loading-screen .ls-brand{font-family:var(--heading-font);font-size:26px;font-weight:700;color:var(--brass-2);}
.hero-top{flex-wrap:wrap;row-gap:10px;}
.person-hero-name,.entry-note,.hero-total-value,.person-hero-total,.modal-title{overflow-wrap:anywhere;}
.modal{max-height:88vh;max-height:88dvh;overscroll-behavior:contain;}
.toast-banner{top:calc(16px + var(--sat));}
.image-viewer-close{top:calc(18px + var(--sat));}
.person-row:focus-visible,.due-row:focus-visible{outline-offset:-2px;}
html[dir="ltr"] .back-btn svg{transform:scaleX(-1);}

/* login / lock: brand panel is desktop-only */
.auth-brand{display:none;}
.auth-side{display:contents;}

@media(max-width:639px){
  .modal{padding-bottom:calc(26px + var(--sab));}
}
@media(max-width:380px){
  .brand{font-size:22px;}
  .hero-total-value{font-size:28px;}
  .person-hero-total{font-size:32px;}
  .person-row{flex-wrap:wrap;row-gap:8px;}
  .person-row-main{flex:1 1 120px;}
  .person-row-actions{flex:1 0 100%;justify-content:flex-end;}
  .entry-date{width:78px;}
  .field-row{flex-wrap:wrap;}
  .field-row>div{flex:1 1 130px;}
  .modal{padding:20px 16px calc(24px + var(--sab));}
}

}
@supports(-webkit-touch-callout:none){

/* ===== Help assistant bubble ===== */
.help-root{position:fixed;inset-inline-end:max(18px,var(--sar));bottom:max(18px,var(--sab));z-index:44;font-family:'Cairo',sans-serif;}
.help-fab{width:56px;height:56px;border-radius:50%;border:none;background:var(--brass);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 12px 26px -8px rgba(0,0,0,.55);transition:transform .15s ease,box-shadow .15s ease;}
.help-fab:hover{transform:translateY(-2px);box-shadow:0 16px 30px -8px rgba(0,0,0,.6);}
.help-fab:active{transform:scale(.96);}
.help-fab svg{width:27px;height:27px;}
.help-panel{position:absolute;inset-inline-end:0;bottom:68px;width:min(400px,calc(100vw - 36px));height:min(620px,calc(100vh - 130px));height:min(620px,calc(100dvh - 130px));display:flex;flex-direction:column;overflow:hidden;background:var(--paper);color:var(--ink-text);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 60px -18px rgba(0,0,0,.6);transform-origin:bottom;animation:helpIn .18s ease;}
.help-panel[hidden]{display:none;}
@keyframes helpIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
.help-head{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-shrink:0;background:linear-gradient(180deg,var(--ink) 0%,var(--ink-2) 100%);color:var(--cream);}
.help-head img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.help-head-txt{flex:1;min-width:0;display:flex;flex-direction:column;}
.help-head-title{font-family:var(--heading-font);font-size:18px;font-weight:700;line-height:1.25;color:var(--brass-2);}
.help-head-sub{font-size:11.5px;line-height:1.5;color:var(--muted-cream);}
.help-icon-btn{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;font-size:20px;line-height:1;background:var(--hero-overlay-bg);border:1px solid var(--hero-overlay-border);color:var(--cream);}
.help-icon-btn:hover{background:var(--hero-overlay-bg-hover);}
.help-msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;}
.help-msg{max-width:90%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.85;overflow-wrap:anywhere;}
.help-msg p{margin:0 0 6px;}
.help-msg p:last-child{margin-bottom:0;}
.help-msg ol{margin:4px 0 0;padding-inline-start:20px;}
.help-msg li{margin:0 0 4px;}
.help-msg b{font-weight:700;color:var(--brass);}
.help-msg.bot{align-self:flex-start;background:var(--paper-2);border:1px solid var(--border);border-end-start-radius:4px;}
.help-msg.user{align-self:flex-end;background:var(--brass);color:#fff;border-end-end-radius:4px;}
.help-typing{align-self:flex-start;display:flex;gap:5px;padding:13px 14px;background:var(--paper-2);border:1px solid var(--border);border-radius:14px;border-end-start-radius:4px;}
.help-typing i{width:6px;height:6px;border-radius:50%;background:var(--muted-ink);animation:helpDot 1s infinite ease-in-out;}
.help-typing i:nth-child(2){animation-delay:.15s;}
.help-typing i:nth-child(3){animation-delay:.3s;}
@keyframes helpDot{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}
.help-chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 10px;flex-shrink:0;max-height:118px;overflow-y:auto;}
.help-chips:empty{padding:0;}
.help-chip{min-height:34px;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600;line-height:1.4;text-align:start;background:var(--paper);border:1px solid var(--border);color:var(--brass);}
.help-chip:hover{background:var(--paper-2);}
.help-form{display:flex;gap:8px;flex-shrink:0;padding:10px 12px calc(10px + var(--sab));border-top:1px solid var(--border);background:var(--paper);}
.help-input{flex:1;min-width:0;height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--ink-text);font-size:14px;}
.help-send{width:42px;height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:12px;cursor:pointer;background:var(--brass);color:#fff;}
.help-send:disabled{opacity:.5;cursor:default;}
.help-send svg{width:18px;height:18px;}
.help-root[dir="rtl"] .help-send svg{transform:scaleX(-1);}
/* keep the bubble from covering the last items when scrolled to the bottom */
.list{padding-bottom:92px;}
.entries-section{padding-bottom:96px;}
@media(max-width:560px){
  .help-panel{position:fixed;inset-inline:0;bottom:0;width:auto;height:min(86vh,680px);height:min(86dvh,680px);border-radius:18px 18px 0 0;border-bottom:none;}
  .help-root.help-open .help-fab{display:none;}
}
@media print{.help-root{display:none !important;}}

/* ===== Neon glow & micro-interactions (design unchanged; hover/focus layers only) ===== */
:root{--neon-rgb:31,122,77;--neon-danger-rgb:166,67,46;}
.hero,.help-head,.auth-brand{--neon-rgb:79,203,140;--neon-danger-rgb:227,132,104;}
body.theme-light .hero,body.theme-light .help-head,body.theme-light .auth-brand{--neon-rgb:31,122,77;--neon-danger-rgb:166,67,46;}
.icon-btn-sm.danger,.btn-debt,.btn-danger{--neon-rgb:var(--neon-danger-rgb);}
.list-panel,.detail-panel,.modal,.legal-body,.help-msgs,.fx-list{scrollbar-width:thin;scrollbar-color:rgba(var(--neon-rgb),.45) transparent;}
.list-panel::-webkit-scrollbar,.detail-panel::-webkit-scrollbar,.modal::-webkit-scrollbar,.legal-body::-webkit-scrollbar,.help-msgs::-webkit-scrollbar,.fx-list::-webkit-scrollbar{width:8px;}
.list-panel::-webkit-scrollbar-thumb,.detail-panel::-webkit-scrollbar-thumb,.modal::-webkit-scrollbar-thumb,.legal-body::-webkit-scrollbar-thumb,.help-msgs::-webkit-scrollbar-thumb,.fx-list::-webkit-scrollbar-thumb{background:rgba(var(--neon-rgb),.4);border-radius:8px;}
.list-panel::-webkit-scrollbar-thumb:hover,.detail-panel::-webkit-scrollbar-thumb:hover{background:rgba(var(--neon-rgb),.7);}

.icon-btn,.icon-btn-sm,.help-icon-btn,.help-fab,.fx-top,.btn-brass,.btn-debt,.btn-paid,.btn-ghost,.btn-danger,.btn-whatsapp,.btn-copy,.btn-share,.seg-btn,.chip,.help-chip,.help-send{transition:box-shadow .12s ease,transform .08s ease,background-color .12s ease,color .12s ease;}
.icon-btn:active,.icon-btn-sm:active,.help-icon-btn:active,.fx-top:active,.btn-brass:active,.btn-debt:active,.btn-paid:active,.btn-ghost:active,.btn-danger:active,.btn-whatsapp:active,.btn-copy:active,.btn-share:active,.seg-btn:active,.chip:active,.help-chip:active{transform:scale(.96);}

/* focus ring (keyboard) */
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid rgb(var(--neon-rgb));outline-offset:2px;box-shadow:0 0 0 4px rgba(var(--neon-rgb),.16),0 0 16px rgba(var(--neon-rgb),.45);}
.search-wrap input:focus,.modal input:focus,.modal textarea:focus,.modal select:focus,.lock-card input:focus,.help-input:focus,.fx-pal-input:focus{box-shadow:0 0 0 3px rgba(var(--neon-rgb),.18),0 0 18px rgba(var(--neon-rgb),.3);}

@media(hover:hover){
  .icon-btn:hover,.icon-btn-sm:hover,.person-hero-actions.secondary .icon-btn-sm:hover,.help-icon-btn:hover{
    color:rgb(var(--neon-rgb));
    box-shadow:0 0 0 1px rgba(var(--neon-rgb),.7),0 0 9px rgba(var(--neon-rgb),.7),0 0 22px rgba(var(--neon-rgb),.4),inset 0 0 12px rgba(var(--neon-rgb),.16);
    transform:translateY(-1px);
  }
  .icon-btn:hover svg,.icon-btn-sm:hover svg,.help-icon-btn:hover svg{filter:drop-shadow(0 0 4px rgba(var(--neon-rgb),.95));}
  .icon-btn.active-toggle:hover{color:#fff;}
  .modal-close:hover{color:rgb(var(--neon-rgb));text-shadow:0 0 10px rgba(var(--neon-rgb),.8);}
  .back-btn:hover{color:rgb(var(--neon-rgb));text-shadow:0 0 12px rgba(var(--neon-rgb),.6);}

  .btn-brass:hover{background:var(--brass);filter:brightness(1.08);--g:31,122,77;}
  .btn-debt:hover,.btn-danger:hover{--g:166,67,46;}
  .btn-paid:hover{--g:61,107,82;}
  .btn-whatsapp:hover{--g:46,158,91;}
  .btn-ghost:hover,.btn-copy:hover,.btn-share:hover,.seg-btn:hover,.chip:hover{--g:var(--neon-rgb);}
  .btn-brass:hover,.btn-debt:hover,.btn-paid:hover,.btn-danger:hover,.btn-whatsapp:hover,.btn-ghost:hover,.btn-copy:hover,.btn-share:hover,.seg-btn:hover{
    box-shadow:0 0 0 1px rgba(var(--g),.75),0 0 12px rgba(var(--g),.6),0 0 30px rgba(var(--g),.32);
    transform:translateY(-1px);
  }
  .chip:hover{border-color:rgb(var(--neon-rgb));color:rgb(var(--neon-rgb));box-shadow:0 0 12px rgba(var(--neon-rgb),.35);}
  .chip.active:hover{color:var(--brass-2);}
  .lock-card [data-action="sign-in-google"]:hover,.lock-card [data-action="auth-email-submit"]:hover{box-shadow:0 0 0 1px rgba(var(--neon-rgb),.7),0 0 14px rgba(var(--neon-rgb),.45),0 0 30px rgba(var(--neon-rgb),.25);transform:translateY(-1px);}
  .lock-forgot:hover,.legal-link:hover{color:rgb(var(--neon-rgb));text-shadow:0 0 10px rgba(var(--neon-rgb),.55);}

  .person-row:hover,.due-row:hover{background-color:rgba(var(--neon-rgb),.07);box-shadow:inset -3px 0 0 rgb(var(--neon-rgb)),inset 0 0 26px -14px rgba(var(--neon-rgb),.95);}
  html[dir="ltr"] .person-row:hover,html[dir="ltr"] .due-row:hover{box-shadow:inset 3px 0 0 rgb(var(--neon-rgb)),inset 0 0 26px -14px rgba(var(--neon-rgb),.95);}
  .hero:hover .hero-total-value{text-shadow:0 0 18px rgba(var(--neon-rgb),.4);}
  .auth-brand-logo:hover{box-shadow:0 0 0 2px rgba(var(--neon-rgb),.6),0 0 26px rgba(var(--neon-rgb),.5),0 18px 40px -16px rgba(0,0,0,.55);}
}
.person-row,.due-row,.hero-total-value{transition:background-color .1s ease,box-shadow .12s ease,text-shadow .2s ease;}

/* cursor spotlight on the dark headers */
.hero,.auth-brand{position:relative;isolation:isolate;}
.hero::after,.auth-brand::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .35s ease;background:radial-gradient(340px circle at var(--mx,50%) var(--my,0%),rgba(var(--neon-rgb),.17),transparent 70%);}
.hero:hover::after,.auth-brand:hover::after{opacity:1;}

/* help bubble: neon breathing ring (stops when the chat is open) */

@media(hover:hover){.help-fab:hover{box-shadow:0 0 0 2px rgba(var(--neon-rgb),.75),0 0 18px rgba(var(--neon-rgb),.8),0 0 40px rgba(var(--neon-rgb),.45);transform:translateY(-2px) scale(1.04);}}

/* tooltips */
.fx-tip{position:fixed;z-index:90;pointer-events:none;max-width:240px;padding:6px 11px;border-radius:9px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;line-height:1.5;white-space:nowrap;background:#16241F;color:#F1E9D6;border:1px solid rgba(79,203,140,.6);box-shadow:0 0 14px rgba(79,203,140,.35),0 8px 20px -8px rgba(0,0,0,.6);opacity:0;transform:translateY(3px);transition:opacity .15s ease,transform .15s ease;}
.fx-tip.on{opacity:1;transform:none;}
.fx-tip::after{content:"";position:absolute;left:var(--ax,50%);width:8px;height:8px;margin-left:-4px;background:#16241F;border:1px solid rgba(79,203,140,.6);transform:rotate(45deg);}
.fx-tip[data-place="top"]::after{bottom:-5px;border-top:none;border-left:none;}
.fx-tip[data-place="bottom"]::after{top:-5px;border-bottom:none;border-right:none;}

/* back to top */
.fx-top{position:fixed;z-index:43;inset-inline-end:max(18px,var(--sar));bottom:calc(max(18px,var(--sab)) + 68px);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--ink);color:var(--brass-2);border:1px solid rgba(var(--neon-rgb),.55);box-shadow:0 0 12px rgba(var(--neon-rgb),.35),0 8px 18px -8px rgba(0,0,0,.6);opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .2s ease,transform .2s ease,visibility .2s,box-shadow .2s ease;}
.fx-top svg{width:20px;height:20px;}
.fx-top.on{opacity:1;visibility:visible;transform:none;}
@media(hover:hover){.fx-top.on:hover{box-shadow:0 0 0 1px rgba(var(--neon-rgb),.8),0 0 18px rgba(var(--neon-rgb),.75),0 0 38px rgba(var(--neon-rgb),.4);transform:translateY(-2px);}}

/* quick search palette */
.fx-pal,.fx-keys{position:fixed;inset:0;z-index:70;display:flex;justify-content:center;padding:max(12px,var(--sat)) 12px 12px;background:rgba(22,36,31,.62);}
.fx-pal[hidden],.fx-keys[hidden]{display:none;}
.fx-pal{align-items:flex-start;padding-top:min(14vh,120px);}
.fx-keys{align-items:center;}
.fx-pal-box,.fx-keys-box{width:min(580px,100%);background:var(--paper);color:var(--ink-text);border-radius:16px;overflow:hidden;font-family:'Cairo',sans-serif;border:1px solid rgba(31,122,77,.5);box-shadow:0 0 0 1px rgba(31,122,77,.25),0 0 34px rgba(79,203,140,.28),0 30px 70px -20px rgba(0,0,0,.65);}
.fx-pal-box{display:flex;flex-direction:column;max-height:min(560px,calc(100dvh - 120px));}
.fx-pal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);color:var(--muted-ink);}
.fx-pal-head>svg{width:20px;height:20px;flex-shrink:0;}
.fx-pal-input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px;color:var(--ink-text);height:34px;}
.fx-pal-input:focus,.fx-pal-input:focus-visible{outline:none;box-shadow:none;}
.fx-pal-head:focus-within{box-shadow:inset 0 -2px 0 rgba(31,122,77,.6);}
.fx-pal-title{font-size:11px;font-weight:700;color:var(--brass);white-space:nowrap;}
.fx-list{list-style:none;margin:0;padding:6px;overflow-y:auto;flex:1;min-height:0;}
.fx-sec{padding:10px 10px 4px;font-size:11.5px;font-weight:700;color:var(--muted-ink);}
.fx-none{padding:26px 12px;text-align:center;font-size:13.5px;color:var(--muted-ink);}
.fx-opt{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;cursor:pointer;}
.fx-opt.on{background:rgba(31,122,77,.1);box-shadow:inset 0 0 0 1px rgba(31,122,77,.45),0 0 16px rgba(79,203,140,.25);}
.fx-av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--heading-font);font-size:17px;font-weight:700;background:var(--ink);color:var(--brass-2);}
.fx-av.fx-cmd svg{width:17px;height:17px;}
.fx-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.fx-main b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fx-main b em{font-style:normal;font-size:10.5px;font-weight:600;margin-inline-start:6px;padding:1px 7px;border-radius:999px;background:var(--paper-2);color:var(--muted-ink);}
.fx-main small{font-size:12px;color:var(--muted-ink);text-align:start;}
.fx-amt{font-size:12.5px;font-weight:700;color:var(--debt);white-space:nowrap;}
.fx-pal-foot{display:flex;flex-wrap:wrap;gap:6px 16px;padding:9px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted-ink);background:var(--paper-2);}

function t(key){
  const lang = (state && state.settings && state.settings.lang) ? state.settings.lang : 'ar';
  const dict = I18N[lang] || I18N.ar;
  return (key in dict) ? dict[key] : (I18N.ar[key] !== undefined ? I18N.ar[key] : key);
}
function curLang(){ return (state && state.settings && state.settings.lang) ? state.settings.lang : 'ar'; }
function localeTag(){ return curLang()==='en' ? 'en-US' : 'ar-JO'; }

/* ---------- Helpers ---------- */
function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatMoney(n){
  n = Number(n)||0;
  const r = Math.round(n*100)/100;
  if(Number.isInteger(r)) return r.toLocaleString('en-US');
  return r.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtAmt(n,currency){
  if(state.settings.hideAmounts) return '<span class="masked-amount">••••</span> '+escapeHtml(currency);
  return formatMoney(n)+' '+escapeHtml(currency);
}
function personCurrency(p){ return (p && p.currency) ? p.currency : state.settings.currency; }
function formatDateLong(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString(localeTag(),{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  }catch(e){ return iso; }
}
function formatDateShort(iso){
  try{ return new Date(iso).toLocaleDateString(localeTag(),{day:'numeric',month:'short'}); }catch(e){ return ''; }
}
function dayLabel(n){ return n===1 ? t('dayWord') : t('daysWord'); }
function amountLabel(total,currency){
  if(Math.abs(total)<0.005) return '<span class="settled">'+t('settled')+'</span>';
  if(total>0) return '<span class="text-debt">'+fmtAmt(total,currency)+'</span>';
  return '<span class="text-paid">'+fmtAmt(Math.abs(total),currency)+'</span>';
}
function personStatusInfo(p){
  const total = p.total||0;
  const dir = p.direction || 'to_me';
  if(Math.abs(total)<0.005) return {cls:'text-muted', label:t('personNoDebtLabel'), amountAbs:0};
  if(dir==='to_me'){
    if(total>0) return {cls:'text-debt', label:t('personOwesLabel'), amountAbs:total};
    return {cls:'text-paid', label:t('personCreditLabel'), amountAbs:-total};
  }
  if(total>0) return {cls:'text-debt', label:t('personYouOweLabel'), amountAbs:total};
  return {cls:'text-paid', label:t('personYouHaveCreditLabel'), amountAbs:-total};
}
function dueDateBadge(dueDateIso){
  if(!dueDateIso) return '';
  const now = new Date(); now.setHours(0,0,0,0);
  const due = new Date(dueDateIso); due.setHours(0,0,0,0);
  const diffDays = Math.round((due-now)/86400000);
  let cls, text;
  if(diffDays<0){ cls='overdue'; text=t('overdueLabel')+' '+Math.abs(diffDays)+' '+dayLabel(Math.abs(diffDays)); }
  else if(diffDays===0){ cls='today'; text=t('dueTodayLabel'); }
  else if(diffDays<=7){ cls='soon'; text=t('dueWithinLabel')+' '+diffDays+' '+dayLabel(diffDays); }
  else{ cls='later'; text=t('dueOnLabel')+' '+formatDateShort(dueDateIso); }
  return '<span class="due-badge '+cls+'">'+text+'</span>';
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function calcTotal(entries){
  return (entries||[]).reduce((s,e)=> s + (e.type==='payment' ? -Number(e.amount||0) : Number(e.amount||0)), 0);
}
function activePeople(){ return state.people.filter(p=> !p.archived); }
function archivedPeople(){ return state.people.filter(p=> !!p.archived); }
function getFilteredSortedPeople(){
  let list = (state.showArchived ? archivedPeople() : activePeople()).slice();
  const q = state.search.trim().toLowerCase();
  if(q) list = list.filter(p => p.name.toLowerCase().includes(q) || p.phone.includes(q));
  if(state.sort==='amount') list.sort((a,b)=> Math.abs(b.total||0)-Math.abs(a.total||0));
  else if(state.sort==='name') list.sort((a,b)=> a.name.localeCompare(b.name,'ar'));
  else list.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  if(!state.showArchived){
    const pinned = list.filter(p=>p.pinned);
    const rest = list.filter(p=>!p.pinned);
    list = pinned.concat(rest);
  }
  return list;
}
function computeGrandTotals(){
  const receivable = {}, payable = {};
  activePeople().forEach(p=>{
    const total = p.total||0;
    if(Math.abs(total)<0.005) return;
    const cur = personCurrency(p);
    const dir = p.direction || 'to_me';
    if(dir==='to_me'){
      if(total>0) receivable[cur]=(receivable[cur]||0)+total; else payable[cur]=(payable[cur]||0)+(-total);
    } else {
      if(total>0) payable[cur]=(payable[cur]||0)+total; else receivable[cur]=(receivable[cur]||0)+(-total);
    }
  });
  return {receivable, payable};
}
function computeAggregateTimeline(){
  const sorted = state.allEntries.filter(e=>{ const p=state.people.find(x=>x.id===e.personId); return p && !p.archived; }).slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
  let running=0;
  return sorted.map(e=>{ running += (e.type==='payment'?-Number(e.amount||0):Number(e.amount||0)); return {date:e.date, value:running}; });
}
function computePersonTimeline(entries){
  const sorted = (entries||[]).slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
  let running=0;
  return sorted.map(e=>{ running += (e.type==='payment'?-Number(e.amount||0):Number(e.amount||0)); return {date:e.date, value:running}; });
}
function computeUpcomingDues(){
  const now = new Date(); now.setHours(0,0,0,0);
  const cutoff = new Date(now); cutoff.setDate(cutoff.getDate()+7); cutoff.setHours(23,59,59,999);
  return state.allEntries.filter(e=>{
    if(e.type!=='debt' || !e.dueDate) return false;
    if(new Date(e.dueDate) > cutoff) return false;
    const p = state.people.find(x=>x.id===e.personId);
    return p && !p.archived && Math.abs(p.total||0) > 0.005;
  }).sort((a,b)=> new Date(a.dueDate)-new Date(b.dueDate));
}
function computeDueDatesForRule(rule, todayIso){
  const dates = [];
  const start = new Date(rule.startDate);
  const startDay = Math.min(Math.max(parseInt(rule.dayOfMonth,10)||1,1),28);
  const lastRun = rule.lastRunDate ? new Date(rule.lastRunDate) : null;
  const todayD = new Date(todayIso);
  todayD.setHours(23,59,59,999);
  let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
  let iterations = 0;
  while(iterations < 240){
    const candidate = new Date(cursor.getFullYear(), cursor.getMonth(), startDay, 12, 0, 0);
    if(candidate > todayD) break;
    if(candidate >= start && (!lastRun || candidate > lastRun)){
      dates.push(candidate.toISOString());
    }
    cursor.setMonth(cursor.getMonth()+1);
    iterations++;
  }
  return dates;
}
function personAvgSettlementDays(entries){
  const sorted = (entries||[]).slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
  const pending = [];
  const durations = [];
  sorted.forEach(e=>{
    const amt = Number(e.amount)||0;
    if(amt<=0) return;
    if(e.type==='debt'){
      pending.push({date:new Date(e.date), remaining:amt});
    } else {
      let pay = amt;
      while(pay>0.0001 && pending.length){
        const head = pending[0];
        const use = Math.min(head.remaining, pay);
        head.remaining -= use; pay -= use;
        if(head.remaining<=0.0001){
          durations.push((new Date(e.date)-head.date)/86400000);
          pending.shift();
        }
      }
    }
  });
  if(!durations.length) return null;
  return Math.round((durations.reduce((s,d)=>s+d,0)/durations.length)*10)/10;
}
function renderTrendChart(points){
  if(!points || points.length<2) return '';
  const w=600,h=140,padX=10,padY=16;
  const values = points.map(p=>p.value);
  let min = Math.min(0, ...values), max = Math.max(0, ...values);
  if(min===max){ min-=1; max+=1; }
  const range = max-min;
  const stepX = (w-padX*2)/(points.length-1);
  const yFor = v => h-padY-((v-min)/range)*(h-padY*2);
  const xFor = i => padX+i*stepX;
  const last = points[points.length-1];
  const lastColor = last.value>0.005 ? 'var(--debt)' : (last.value<-0.005 ? 'var(--paid)' : 'var(--muted-ink)');
  const linePts = points.map((p,i)=> xFor(i)+','+yFor(p.value)).join(' ');
  const areaPath = 'M'+xFor(0)+','+yFor(0)+' L'+points.map((p,i)=> xFor(i)+','+yFor(p.value)).join(' L')+' L'+xFor(points.length-1)+','+yFor(0)+' Z';
  const zeroY = yFor(0);
  const dots = points.map((p,i)=> '<circle cx="'+xFor(i)+'" cy="'+yFor(p.value)+'" r="2.5" fill="'+lastColor+'" />').join('');
  return '<div class="trend-chart" dir="ltr">'
    +'<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:110px;display:block;" role="img" aria-hidden="true">'
      +'<line x1="'+padX+'" y1="'+zeroY+'" x2="'+(w-padX)+'" y2="'+zeroY+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3" />'

async function hashPassword(pw){
  try{
    const enc = new TextEncoder().encode(pw);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=0; for(let i=0;i<pw.length;i++){ h=(h<<5)-h+pw.charCodeAt(i); h|=0; }
    return 'fallback:'+h;
  }
}

  document.body.appendChild(a); a.click(); a.remove();

}

async function shareOrDownload(blob, filename, mime){
  try{
    if(navigator.canShare && navigator.share){
      const file = new File([blob], filename, {type:mime});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:filename});
        return true;
      }
    }
  }catch(e){ /* user cancelled or unsupported: fall through */ if(e && e.name==='AbortError') return false; }
  triggerDownloadBlob(blob, filename);
  showToast(t('toastShareUnavailable'),'success');
  return false;
}
async function copyToClipboard(text){

    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){ return false; }
}
function compressImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    if(!file || !file.type || file.type.indexOf('image/')!==0){ reject(new Error('not_image')); return; }
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        const md = maxDim||900;
        if(w>h){ if(w>md){ h=Math.round(h*md/w); w=md; } }
        else { if(h>md){ w=Math.round(w*md/h); h=md; } }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        try{ resolve(canvas.toDataURL('image/jpeg', quality||0.62)); }
        catch(err){ reject(err); }
      };
      img.onerror = function(){ reject(new Error('img_load_failed')); };
      img.src = ev.target.result;
    };
    reader.onerror = function(){ reject(new Error('read_failed')); };
    reader.readAsDataURL(file);
  });
}

async function biometricEnroll(){
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userId = crypto.getRandomValues(new Uint8Array(16));
    const cred = await navigator.credentials.create({publicKey:{
      challenge, rp:{name:'Hisbet Arab'},
      user:{id:userId, name:'local-user', displayName:'Local User'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required'},
      timeout:60000
    }});
    if(!cred) return null;
    return bufToB64(cred.rawId);
  }catch(e){ console.error('biometric enroll failed', e); return null; }
}
async function biometricVerify(credentialIdB64){
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const assertion = await navigator.credentials.get({publicKey:{
      challenge, allowCredentials:[{id:b64ToBuf(credentialIdB64), type:'public-key'}],
      userVerification:'required', timeout:60000
    }});
    return !!assertion;
  }catch(e){ console.error('biometric verify failed', e); return false; }
}

/* ---------- Storage (Firestore, per-account) ---------- */
let memoryStore = {};
function firestoreDb(){
  if(!window._firestoreDb) window._firestoreDb = firebase.firestore();
  return window._firestoreDb;
}
function userDocRef(key){
  const uid = auth.currentUser ? auth.currentUser.uid : null;
  if(!uid) return null;
  return firestoreDb().collection('users').doc(uid).collection('data').doc(key);
}
/* ---------- Fast storage: memory cache + background sync (buttons never wait for the network) ---------- */
const fastCache = new Map();
let fastPending = 0;
function fastKey(key){ return (auth.currentUser ? auth.currentUser.uid : 'anon') + '|' + key; }
function fastTrack(make, key){
  let p; try{ p = make(); }catch(e){ p = Promise.reject(e); }
  fastPending++;
  Promise.resolve(p).then(function(){ fastPending--; }, function(e){
    fastPending--; console.error('background save failed', key, e);
    fastCache.delete(fastKey(key));
    try{ showToast(curLang()==='en' ? 'Could not save your changes. Check your connection.' : 'تعذّر حفظ التغييرات. تحقق من اتصالك بالإنترنت.', 'error'); }catch(_){}
  });
}
window.addEventListener('beforeunload', function(e){ if(fastPending > 0){ e.preventDefault(); e.returnValue = ''; } });
async function storageGet(key){
  const ref = userDocRef(key);
  if(!ref) return memoryStore[key] ?? null;
  const ck = fastKey(key);
  if(fastCache.has(ck)) return fastCache.get(ck);
  try{
    const snap = await ref.get();
    const v = snap.exists ? snap.data().value : null;
    if(!fastCache.has(ck)) fastCache.set(ck, v);
    return fastCache.get(ck);
  }catch(e){ console.error('storageGet failed', e); return memoryStore[key] ?? null; }
}
async function storageSet(key,value){
  const ref = userDocRef(key);
  if(!ref){ memoryStore[key]=value; return true; }
  fastCache.set(fastKey(key), value);
  fastTrack(function(){ return ref.set({value: value, updatedAt: firebase.firestore.FieldValue.serverTimestamp()}); }, key);
  return true;
}
async function storageDelete(key){
  const ref = userDocRef(key);
  if(!ref){ delete memoryStore[key]; return; }
  fastCache.set(fastKey(key), null);
  fastTrack(function(){ return ref.delete(); }, key);
}
/* refresh a person's entries from the server in the background (other devices), without blocking the click */
const fastRevalAt = {};
async function revalidateEntries(personId){
  const now = Date.now();
  if(fastRevalAt[personId] && now - fastRevalAt[personId] < 30000) return;
  fastRevalAt[personId] = now;
  const ref = userDocRef('entries:'+personId); if(!ref) return;
  try{
    const ck = fastKey('entries:'+personId), before = fastCache.get(ck);
    const snap = await ref.get();
    if(fastPending > 0) return;
    const v = snap.exists ? snap.data().value : null;
    if(v === before || (v == null && before == null)) return;
    fastCache.set(ck, v);
    if(state.currentPersonId===personId && state.view==='person' && !state.modal){
      state.currentEntries = v ? JSON.parse(v) : [];
      state.allEntries = state.allEntries.filter(function(e){ return e.personId!==personId; }).concat(state.currentEntries.map(function(e){ return Object.assign({personId:personId}, e); }));
      render();
    }
  }catch(_){}
}
async function loadEntries(personId){
  const raw = await storageGet('entries:'+personId);
  return raw ? JSON.parse(raw) : [];
}
async function saveEntries(personId, entries){
  await storageSet('entries:'+personId, JSON.stringify(entries));
}

function mapAuthError(e){
  const code = e && e.code;
  if(code==='auth/weak-password') return t('authWeakPassword');
  if(code==='auth/invalid-email') return t('authInvalidEmail');
  if(code==='auth/email-already-in-use') return t('authEmailInUse');
  if(code==='auth/user-not-found') return t('authUserNotFound');
  if(code==='auth/wrong-password' || code==='auth/invalid-credential') return t('authWrongPassword');
  if(code==='auth/popup-closed-by-user' || code==='auth/cancelled-popup-request') return '';
  return t('authErrorGeneric');
}
async function signInWithGoogle(){
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
  }catch(e){
    console.error('sign-in failed', e);
    state.authError = mapAuthError(e);
    renderSignInGate();
  }
}
async function signInAsGuest(){
  try{
    await auth.signInAnonymously();
  }catch(e){
    console.error('guest sign-in failed', e);
    state.authError = mapAuthError(e);
    renderSignInGate();
  }
}
async function handleAuthEmailSubmit(){
  const emailEl = document.getElementById('authEmailInput');
  const pwEl = document.getElementById('authPasswordInput');
  const email = emailEl ? emailEl.value.trim() : '';
  const password = pwEl ? pwEl.value : '';
  if(!email || !password){ state.authError = t('authErrorGeneric'); renderSignInGate(email); return; }
  try{
    if(state.authMode==='signup'){
      await auth.createUserWithEmailAndPassword(email, password);
    } else {
      await auth.signInWithEmailAndPassword(email, password);
    }
  }catch(e){
    console.error('email auth failed', e);
    state.authError = mapAuthError(e);
    renderSignInGate(email);
  }
}
async function handleAuthForgotPassword(){
  const emailEl = document.getElementById('authEmailInput');
  const email = emailEl ? emailEl.value.trim() : '';
  if(!email){ state.authError = t('authInvalidEmail'); renderSignInGate(email); return; }
  try{
    await auth.sendPasswordResetEmail(email);
    state.authError = null;
    renderSignInGate(email);
    showToast(t('authResetSent'), 'success');
  }catch(e){
    console.error('reset password failed', e);
    state.authError = mapAuthError(e);
    renderSignInGate(email);
  }
}
async function signOutUser(){
  try{ await auth.signOut(); }catch(e){ console.error('sign-out failed', e); }
}
function isGuest(){
  return !!(state.currentUser && state.currentUser.isAnonymous);
}

sections: [
{ h: "1. مقدمة", p: [
  "تحترم «حِسبة عَرَب» («التطبيق» أو «نحن») خصوصيتك وتلتزم بحماية بياناتك الشخصية. توضّح هذه السياسة ما البيانات التي نعالجها، ولماذا، وكيف نحميها، وما الحقوق التي تتمتع بها، وذلك وفق التشريعات النافذة في المملكة الأردنية الهاشمية ومنها قانون حماية البيانات الشخصية رقم (24) لسنة 2023.",

{ h: "2. البيانات التي نعالجها", p: ["نعالج الأنواع التالية من البيانات، وهي إمّا تقدّمها أنت بنفسك أو تنتج عن استخدامك للتطبيق:"], ul: [

{ h: "3. لماذا نعالج بياناتك", p: ["نستخدم بياناتك للأغراض الآتية فقط:"], ul: [
  "تشغيل التطبيق وتقديم خدماته، ومنها حفظ دفترك ومزامنته بين أجهزتك.",

  "تحسين استقرار التطبيق ومعالجة الأعطال.",
  "الوفاء بالالتزامات القانونية." ],
  after: ["لا نبيع بياناتك ولا نؤجّرها ولا نشاركها لأغراض تسويقية، ولا نعرض إعلانات، ولا نستخدم أدوات تحليل سلوكي أو تتبّع إعلاني."] },
{ h: "4. الأساس القانوني", p: [

{ h: "5. الجهات الخارجية التي نعتمد عليها", p: ["نستعين بمزوّدي خدمة لتشغيل التطبيق، ولكل منهم سياسة خصوصية خاصة به:"], ul: [

  "واتساب والرسائل النصية: عند ضغطك «إرسال تذكير» يفتح التطبيق واتساب أو تطبيق الرسائل في جهازك ومعه نص جاهز؛ يتم الإرسال من حسابك وبقرارك وحدك، ولا نرسل رسائل نيابة عنك ولا نحتفظ بنصوصها، ونسجّل فقط تاريخ آخر تذكير." ],

{ h: "7. التخزين المحلي وملفات الارتباط", p: [
  "يحتفظ المتصفح بجلسة تسجيل دخولك عبر خدمة المصادقة (باستخدام التخزين المحلي أو IndexedDB) كي لا تضطر لتسجيل الدخول في كل زيارة. لا نستخدم ملفات ارتباط إعلانية أو تتبعية. يمكنك مسح هذه البيانات من إعدادات المتصفح، وسيؤدي ذلك إلى تسجيل خروجك." ] },
{ h: "8. مدة الاحتفاظ والحذف", p: [
  "نحتفظ ببياناتك ما دام حسابك قائماً. يمكنك في أي وقت حذف بيانات دفترك بالكامل من الإعدادات ثم «حذف جميع البيانات»، فتُحذف أسماء الأشخاص وحركاتهم وإعداداتك من خوادمنا. ولحذف حساب الدخول نفسه (البريد أو معرّف الحساب) تواصل معنا عبر {contact} وسننفّذ الطلب خلال مدة معقولة لا تتجاوز 30 يوماً.",
  "بيانات حساب الزائر مؤقتة ومرتبطة بجهازك، وقد لا يمكن استرجاعها بعد تسجيل الخروج أو مسح بيانات المتصفح." ] },
{ h: "9. أمن البيانات", p: [
  "نعتمد إجراءات تقنية وتنظيمية معقولة لحماية بياناتك، منها تشفير الاتصال بين متصفحك والخوادم (HTTPS)، وتشفير البيانات المخزّنة لدى مزوّد الاستضافة، وربط بياناتك بحسابك، وإمكانية قفل التطبيق بكلمة مرور أو بصمة. ومع ذلك لا توجد وسيلة نقل أو تخزين إلكتروني آمنة بنسبة 100%، وتبقى مسؤولاً عن سرية بيانات دخولك وعن تأمين جهازك." ] },
{ h: "10. حقوقك", p: ["وفق القانون، يحق لك:"], ul: [
  "العلم بالبيانات التي نعالجها عنك والاطلاع عليها والحصول على نسخة منها (يمكنك تنزيل نسخة كاملة بصيغة JSON أو CSV أو Excel من الإعدادات).",
  "تصحيح بياناتك أو تحديثها أو استكمالها (مباشرة من داخل التطبيق).",
  "طلب حذف بياناتك أو تقييد معالجتها.",
  "سحب موافقتك والاعتراض على المعالجة في الحالات التي يجيزها القانون." ],
  after: ["لممارسة هذه الحقوق استخدم أدوات التطبيق أو تواصل معنا عبر {contact}. ولك الحق في تقديم شكوى إلى الجهة المختصة بحماية البيانات الشخصية في المملكة (الوحدة المختصة في وزارة الاقتصاد الرقمي والريادة) إذا رأيت أن حقوقك لم تُحترم."] },
{ h: "11. بيانات الأشخاص الذين تضيفهم", p: [
  "عندما تُدخل اسم شخص آخر ورقم هاتفه ومبالغ تخصه، فإننا نعالج هذه البيانات نيابةً عنك لغرض وحيد هو حفظها وعرضها لك. أنت المسؤول عن أن يكون لديك مبرر مشروع لتسجيلها، وعن استخدامها لمتابعة حساباتك الشخصية فقط، وعن عدم استعمالها في المضايقة أو الإزعاج أو الإفصاح عنها لمن لا حق له بها." ] },

{ h: "14. التواصل", p: ["لأي استفسار يتعلق بالخصوصية أو ببياناتك يمكنك التواصل معنا عبر {contact}."] }
] },
terms: {
title: "الشروط والأحكام",
sections: [
{ h: "1. القبول", p: [
  "تحكم هذه الشروط والأحكام استخدامك لتطبيق «حِسبة عَرَب». بإنشاء حساب أو بتسجيل الدخول (بما فيه الدخول كزائر) أو باستخدام التطبيق فإنك توافق على هذه الشروط وعلى سياسة الخصوصية. إن لم توافق فلا تستخدم التطبيق." ] },
{ h: "2. وصف الخدمة", p: [
  "«حِسبة عَرَب» دفتر إلكتروني يتيح لك تسجيل ديونك ودفعاتك ومتابعتها، وعرض الاستحقاقات والتقارير، وتجهيز نصوص تذكير تُرسل عبر واتساب أو الرسائل النصية من جهازك.",
  "التطبيق أداة تنظيمية فقط؛ فهو ليس بنكاً ولا جهة إقراض أو تحصيل، ولا يقدّم استشارات مالية أو قانونية، ولا ينفّذ أي تحويل أو دفع للأموال. وسجلاتك فيه لا تُعدّ بذاتها سنداً أو دليلاً قانونياً ملزماً، وأنت المسؤول عن دقة ما تدخله." ] },
{ h: "3. الأهلية والحساب", ul: [
  "يجب أن يكون عمرك 18 عاماً فأكثر، أو أن تكون مؤهلاً قانونياً للتعاقد.",
  "تلتزم بتقديم معلومات صحيحة والحفاظ على سرية بيانات دخولك، وتتحمل مسؤولية كل نشاط يتم عبر حسابك.",
  "أبلغنا فوراً عند الاشتباه بأي استخدام غير مصرح به لحسابك.",
  "حساب الزائر مؤقت ومرتبط بجهازك، وقد تفقد بياناته عند تسجيل الخروج." ] },
{ h: "4. الاستخدام المقبول", p: ["تتعهد بعدم استخدام التطبيق في أي مما يلي:"], ul: [
  "أي غرض غير مشروع أو احتيالي أو مخالف للأنظمة والآداب العامة.",
  "تهديد الآخرين أو ابتزازهم أو مضايقتهم أو التشهير بهم، بما في ذلك عبر رسائل التذكير؛ ويجب أن تكون تذكيراتك مهذبة ومشروعة.",
  "تسجيل بيانات أشخاص أو التواصل معهم بما ينتهك خصوصيتهم أو حقوقهم.",
  "محاولة اختراق التطبيق أو تعطيله أو الوصول إلى بيانات غيرك أو الالتفاف على إجراءات الأمان أو إجراء هندسة عكسية للشيفرة، أو استخدام وسائل آلية لاستخراج المحتوى." ],
  after: ["أنت وحدك المسؤول عن محتوى الرسائل التي ترسلها وعن علاقتك بالأشخاص المسجلين في دفترك."] },
{ h: "5. محتواك وبياناتك", p: [
  "تبقى ملكية البيانات التي تُدخلها لك. وتمنحنا ترخيصاً محدوداً غير حصري لتخزينها ومعالجتها وعرضها لك فقط بالقدر اللازم لتشغيل الخدمة، وفق سياسة الخصوصية. وتقرّ بأنك مخوّل بإدخال بيانات الأشخاص الذين تضيفهم." ] },
{ h: "6. حقوق الملكية الفكرية وحقوق النشر", p: [
  "© {year} حِسبة عَرَب. جميع الحقوق محفوظة.",
  "التطبيق وتصميمه وواجهاته وشعاره واسمه وشيفرته ونصوصه ومحتواه محمية بموجب قانون حماية حق المؤلف والحقوق المجاورة الأردني رقم (22) لسنة 1992 وتعديلاته والاتفاقيات الدولية ذات الصلة. ونمنحك ترخيصاً شخصياً محدوداً غير حصري وغير قابل للنقل أو الترخيص من الباطن لاستخدام التطبيق لأغراضك الخاصة وفق هذه الشروط.",
  "لا يجوز نسخ أي جزء من التطبيق أو تعديله أو توزيعه أو إعادة نشره أو بيعه أو إنشاء أعمال مشتقة منه أو استخدام اسمه أو شعاره دون إذن كتابي مسبق منا. وتبقى أسماء وشعارات الجهات الأخرى (مثل جوجل وواتساب) ملكاً لأصحابها." ] },
{ h: "7. النسخ الاحتياطي ومسؤوليتك عن بياناتك", p: [
  "ننصحك بأخذ نسخ احتياطية دورية من الإعدادات. ولا نتحمل مسؤولية فقدان البيانات الناتج عن حذفك لها، أو عن فقدان وصولك إلى حسابك، أو عن استخدام حساب زائر، أو عن أعطال خارجة عن إرادتنا." ] },
{ h: "8. توفر الخدمة وتعديلها", p: [
  "نسعى لإبقاء التطبيق متاحاً ومستقراً، لكننا لا نضمن خلوّه من الأخطاء أو عدم انقطاعه. ويجوز لنا تعديل التطبيق أو ميزاته أو إيقافه كلياً أو جزئياً، ونبذل جهدنا لإخطارك مسبقاً بأي تغيير جوهري متى أمكن." ] },
{ h: "9. إخلاء الضمانات", p: [
  "يُقدَّم التطبيق «كما هو» و«كما هو متاح» دون أي ضمانات صريحة أو ضمنية، بما فيها ضمانات الدقة أو الملاءمة لغرض معين أو عدم الانقطاع، وذلك إلى أقصى حد يسمح به القانون." ] },
{ h: "10. تحديد المسؤولية", p: [
  "إلى أقصى حد يسمح به القانون، لا نتحمل أي مسؤولية عن أضرار غير مباشرة أو تبعية أو عرضية، ولا عن خسارة أرباح أو سمعة أو بيانات، ولا عن أي نزاع ينشأ بينك وبين الأشخاص المسجلين في دفترك، ولا عن عدم تحصيل أي دين. ولا يستثني ذلك أي مسؤولية لا يجوز استثناؤها بموجب القانون." ] },
{ h: "11. التعويض", p: [
  "توافق على تعويضنا وإخلاء مسؤوليتنا عن أي مطالبة أو خسارة ناشئة عن استخدامك المخالف للتطبيق أو إخلالك بهذه الشروط أو بحقوق الغير." ] },
{ h: "12. الإيقاف والإنهاء", p: [
  "يمكنك التوقف عن استخدام التطبيق وحذف بياناتك في أي وقت. ويجوز لنا تعليق حسابك أو إنهاؤه إذا خالفت هذه الشروط أو استُخدم حسابك بطريقة تضر بالتطبيق أو بالآخرين. وتبقى الأحكام التي تستمر بطبيعتها (كالملكية الفكرية وإخلاء المسؤولية) سارية بعد الإنهاء." ] },
{ h: "13. خدمات الأطراف الثالثة", p: [
  "يعتمد التطبيق على خدمات جهات خارجية (مثل جوجل وواتساب)، ويخضع استخدامك لها لشروطها وسياساتها. ولا نتحمل مسؤولية توقفها أو تغيّر عملها." ] },
{ h: "14. تعديل الشروط", p: [
  "قد نعدّل هذه الشروط من وقت لآخر وننشر النسخة الجديدة مع تاريخ تحديثها. استمرارك في استخدام التطبيق بعد النشر يُعدّ قبولاً للشروط المعدّلة." ] },
{ h: "15. القانون الواجب التطبيق والاختصاص", p: [
  "تخضع هذه الشروط وتُفسَّر وفق قوانين المملكة الأردنية الهاشمية. نسعى أولاً إلى حل أي خلاف وديّاً، وإن تعذّر ذلك فتختص المحاكم الأردنية المختصة بالنظر فيه." ] },
{ h: "16. التواصل", p: ["لأي استفسار حول هذه الشروط يمكنك التواصل معنا عبر {contact}."] }
] }
},
en: {
privacy: {
title: "Privacy Policy",
sections: [
{ h: "1. Introduction", p: [
  "Hisbet Arab (the “App”, “we”, “us”) respects your privacy and is committed to protecting your personal data. This policy explains what data we process, why, how we protect it, and what rights you have, in line with the laws in force in the Hashemite Kingdom of Jordan, including Personal Data Protection Law No. 24 of 2023.",
  "By using the App or creating an account you confirm that you have read and understood this policy and agree to your data being processed accordingly." ] },
{ h: "2. Data we process", p: ["We process the following data, which you provide yourself or which results from your use of the App:"], ul: [
  "Account data: your email address, your name and photo if provided by your Google account, and a unique account identifier. Your account password is handled by the authentication service and is never visible to us.",
  "Guest accounts: a temporary anonymous identifier with no email address or name.",
  "Ledger data you enter: names and phone numbers of people, debt and payment amounts, dates, notes and due dates, recurring debts and installments, and receipt photos if you attach them.",
  "Settings: currency, language, theme, hidden-amounts mode, lock and backup preferences, and the date of your last reminder or backup.",
  "Lock data: your lock password is stored only as an unreadable cryptographic hash, plus a credential identifier if you enable fingerprint or Face ID unlock. Your biometric data itself stays on your device and is never accessible to us.",
  "Technical data: our hosting providers (Google) process data such as IP address and browser or device type for operation and security." ] },
{ h: "3. Why we process your data", p: ["We use your data only to:"], ul: [
  "run the App and provide its features, including saving your ledger and syncing it across your devices;",
  "sign you in, protect your account and prevent unauthorized access;",
  "remember your preferences and settings;",
  "improve stability and fix faults;",
  "meet our legal obligations." ],
  after: ["We do not sell or rent your data, share it for marketing purposes, show advertising, or use behavioral analytics or advertising trackers."] },
{ h: "4. Legal basis", p: [
  "We process your data on the basis of your consent, given when you register and use the App, as necessary to provide the service you asked for, and to meet our legal obligations. You may withdraw your consent at any time by deleting your data or account, without affecting the lawfulness of processing carried out before withdrawal." ] },
{ h: "5. Third parties we rely on", p: ["We use service providers to operate the App. Each has its own privacy policy:"], ul: [

function legalYears(){
  const y = new Date().getFullYear();
  return y > LEGAL_CONFIG.startYear ? (LEGAL_CONFIG.startYear + '–' + y) : String(LEGAL_CONFIG.startYear);
}
function legalContact(){
  if(LEGAL_CONFIG.email){
    const e = escapeHtml(LEGAL_CONFIG.email);
    return '<a href="mailto:'+e+'" dir="ltr">'+e+'</a>';
  }
  return curLang()==='en' ? 'the contact channels published on this site' : 'وسائل التواصل المنشورة في هذا الموقع';
}
function legalText(str){
  return escapeHtml(str).split('{contact}').join(legalContact()).split('{year}').join(legalYears());
}
function copyrightText(){
  return '© '+legalYears()+' '+t('appName')+'. '+t('rightsReserved');
}
function renderLegalFooter(){
  return '<div class="legal-footer">'
    +'<div class="legal-links">'
      +'<button type="button" class="legal-link" data-action="open-legal" data-doc="privacy">'+t('privacyLink')+'</button>'
      +'<button type="button" class="legal-link" data-action="open-legal" data-doc="terms">'+t('termsLink')+'</button>'
    +'</div>'
    +'<p class="legal-copy">'+copyrightText()+'</p>'
  +'</div>';
}
function renderLegalModal(m){
  const lang = curLang()==='en' ? 'en' : 'ar';
  const doc = LEGAL_DOCS[lang][m.doc];
  const other = m.doc==='privacy' ? 'terms' : 'privacy';
  const body = doc.sections.map(function(sec){
    return '<section class="legal-sec"><h4>'+escapeHtml(sec.h)+'</h4>'
      +(sec.p||[]).map(function(x){ return '<p>'+legalText(x)+'</p>'; }).join('')
      +(sec.ul ? '<ul>'+sec.ul.map(function(x){ return '<li>'+legalText(x)+'</li>'; }).join('')+'</ul>' : '')
      +(sec.after||[]).map(function(x){ return '<p>'+legalText(x)+'</p>'; }).join('')
    +'</section>';
  }).join('');
  return '<button class="modal-close" data-action="close-legal" aria-label="'+t('legalClose')+'">×</button>'
    +'<h3 class="modal-title">'+escapeHtml(doc.title)+'</h3>'
    +'<p class="modal-sub">'+t('legalUpdatedLabel')+escapeHtml(LEGAL_CONFIG.updated[lang])+'</p>'
    +'<div class="legal-body" tabindex="0">'+body+'</div>'
    +'<div class="modal-actions">'
      +'<button type="button" class="btn-ghost" data-action="open-legal" data-doc="'+other+'">'+t(other==='privacy'?'privacyLink':'termsLink')+'</button>'
      +'<button type="button" class="btn-brass" data-action="close-legal">'+t('legalClose')+'</button>'
    +'</div>'
    +'<p class="legal-copy">'+copyrightText()+'</p>';
}

/* open a policy directly with  #privacy  or  #terms  (usable as a public link) */
let legalReady = false;
function legalHash(){ const m = (location.hash||'').match(/^#(privacy|terms)$/); return m ? m[1] : null; }
function legalFromHash(){
  const d = legalHash();
  if(d) state.modal = {type:'legal', doc:d};
  legalReady = true;
  if(d) render();
}
window.addEventListener('hashchange', function(){
  const d = legalHash();
  if(d){ state.modal = {type:'legal', doc:d}; render(); }
  else if(state.modal && state.modal.type==='legal'){ state.modal = null; render(); }
});

const DEFAULT_SETTINGS = {
  currency:'د.أ', theme:'dark', lang:'ar', hideAmounts:false,
  autoLockMinutes:5, backupReminderEnabled:true, backupReminderDays:7,
  lastBackupAt:null, messageTone:'friendly'
};
const state = {
  view:'list', people:[], currentPersonId:null, currentEntries:[], allEntries:[],
  search:'', sort:'recent', settings:Object.assign({},DEFAULT_SETTINGS), modal:null, loading:true,
  lock:{enabled:false, hash:'', biometricId:null, failedAttempts:0, lockedUntil:null},
  locked:false, showArchived:false, backupBannerDismissedAt:null, viewingImage:null, currentUser:null,
  authMode:'login', authError:null
};
let pendingImportData = null;
let pendingFocus = null;
let pendingReceiptData = null;
let autoLockTimer = null;
function captureFocus(){
  const el = document.activeElement;
  if(el && el.id){ pendingFocus = {id:el.id, start:el.selectionStart, end:el.selectionEnd}; }
}
function restoreFocus(){
  if(pendingFocus){
    const el = document.getElementById(pendingFocus.id);
    if(el){
      el.focus();
      if(typeof pendingFocus.start==='number' && el.setSelectionRange){
        try{ el.setSelectionRange(pendingFocus.start,pendingFocus.end); }catch(e){}
      }
    }
    pendingFocus = null;
  }
}
function resetAutoLockTimer(){
  if(autoLockTimer) clearTimeout(autoLockTimer);
  const mins = Number(state.settings.autoLockMinutes)||0;
  if(!state.lock.enabled || mins<=0 || state.locked) return;
  autoLockTimer = setTimeout(function(){
    if(state.lock.enabled && !state.locked){
      state.locked = true; state.modal = null; render();
    }
  }, mins*60*1000);
}
['click','keydown','touchstart','input'].forEach(function(evt){
  document.addEventListener(evt, function(){ if(!state.locked) resetAutoLockTimer(); }, {passive:true});
});

/* ---------- Rendering ---------- */
function applyGlobalChrome(){
  try{ helpApplyLang(); }catch(_){}
  try{ fxSync(); }catch(_){}
  document.body.classList.toggle('theme-light', state.settings.theme==='light');
  document.body.classList.toggle('lang-en', state.settings.lang==='en');
  const lang = curLang();
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='en' ? 'ltr' : 'rtl';
  const titleEl = document.getElementById('pageTitle');
  if(titleEl) titleEl.textContent = t('appName') + ' — ' + (lang==='en' ? 'Debt Ledger' : 'دفتر الديون');
  const tc = document.querySelector('meta[name="theme-color"]');
  if(tc) tc.setAttribute('content', state.settings.theme==='light' ? '#F7F1E1' : '#1E2E29');
}
function render(){
  if(legalReady && !(state.modal && state.modal.type==='legal') && legalHash()){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(_){} }
  if(!state.currentUser){ renderSignInGate(state.authEmailDraft||''); return; }
  applyGlobalChrome();
  const app = document.getElementById('app');
  if(state.locked){
    app.innerHTML = renderLockScreenHTML() + renderModal() + renderImageViewer();
    const el = document.getElementById('unlockPasswordInput');
    if(el && !state.modal) el.focus();
    return;
  }
  if(state.loading){ app.innerHTML = '<div class="loading-screen">'+(curLang()==='en' ? 'Loading…' : '...جارِ التحميل')+'</div>'; return; }
  app.innerHTML = renderShell() + renderModal() + renderImageViewer();
  app.querySelectorAll('.person-row[data-action],.due-row[data-action]').forEach(function(el){ el.setAttribute('tabindex','0'); });
  restoreFocus();
  if(state.modal && state.modal.autofocus){
    const el = document.getElementById(state.modal.autofocus);
    if(el) el.focus();
  }
  maybeShowBackupBanner();
}

function renderDuesSection(){
  if(state.showArchived) return '';
  const dues = computeUpcomingDues();
  if(!dues.length) return '';
  const rows = dues.map(e=>{
    const p = state.people.find(x=>x.id===e.personId);
    if(!p) return '';
    return '<div class="due-row" data-action="open-person" data-id="'+p.id+'">'
      +'<div class="due-main">'
        +'<div class="due-name">'+escapeHtml(p.name)+'</div>'
        +'<div class="due-note">'+fmtAmt(e.amount,personCurrency(p))+(e.note?' — '+escapeHtml(e.note):'')+'</div>'
      +'</div>'
      +dueDateBadge(e.dueDate)
      +'<button class="icon-btn-sm" data-action="send-due-reminder" data-person="'+p.id+'" data-entry="'+e.id+'" aria-label="'+t('sendReminder')+'">'+ICONS.message+'</button>'
    +'</div>';
  }).join('');
  return '<div class="dues-section"><div class="entries-title">'+t('duesTitle')+'</div>'+rows+'</div>';
}

function renderBackupBanner(){
  if(state.showArchived || !state.settings.backupReminderEnabled) return '';
  const last = state.settings.lastBackupAt ? new Date(state.settings.lastBackupAt) : null;
  const days = Number(state.settings.backupReminderDays)||7;
  const dueDate = last ? new Date(last.getTime()+days*86400000) : null;
  const overdue = !last || (dueDate && dueDate <= new Date());
  if(!overdue) return '';
  if(state.backupBannerDismissedAt){
    const dismissed = new Date(state.backupBannerDismissedAt);
    if((new Date()-dismissed) < 24*3600*1000) return '';
  }
  return '<div class="banner">'
    +'<span>'+t('toastBackupSuggest')+'</span>'
    +'<div class="banner-actions">'
      +'<button class="banner-link" data-action="open-settings-backup">'+t('takeBackupNow')+'</button>'
      +'<button class="banner-close" data-action="dismiss-backup-banner" aria-label="'+t('dismiss')+'">×</button>'
    +'</div>'
  +'</div>';
}

  return '<div class="hero">'
      +'<div class="hero-top">'
        +'<div style="display:flex;align-items:center;gap:9px;">'
          +'<img src="'+LOGO_DATA_URI+'" alt="" style="width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;" />'
          +'<h1 class="brand">'+t('appName')+'</h1>'

function renderRecurringSection(p){
  const rules = p.recurring || [];
  const rows = rules.map(r=>{
    const meta = (curLang()==='en' ? ('Day '+r.dayOfMonth+' of every month') : ('يوم '+r.dayOfMonth+' من كل شهر'))+(r.note?' — '+escapeHtml(r.note):'')+(r.active?'':' ('+(curLang()==='en'?'paused':'متوقف')+')');
    return '<div class="recurring-row">'
      +'<div class="recurring-main">'
        +'<div class="recurring-amount">'+fmtAmt(r.amount,personCurrency(p))+'</div>'
        +'<div class="recurring-meta">'+meta+'</div>'
      +'</div>'
      +'<div class="recurring-actions">'
        +'<button class="icon-btn-sm" data-action="toggle-recurring" data-id="'+r.id+'" data-person="'+p.id+'" aria-label="'+(r.active?t('deleteAction'):t('add'))+'">'+(r.active?ICONS.pause:ICONS.play)+'</button>'
