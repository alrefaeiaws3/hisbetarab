function renderDetailPanelInner(){
  const p = state.currentPersonId ? state.people.find(x=>x.id===state.currentPersonId) : null;
  if(!p){
    if(state.currentPersonId){ state.currentPersonId=null; state.view='list'; }
    return '<div class="detail-empty"><h3>'+t('detailEmptyTitle')+'</h3><p>'+t('detailEmptyText')+'</p></div>';
  }
  const cur = personCurrency(p);
  const info = personStatusInfo(p);
  const dir = p.direction || 'to_me';
  const displayAmt = info.amountAbs<0.005 ? (state.settings.hideAmounts?'<span class="masked-amount">••••</span>':'0') : (state.settings.hideAmounts? '<span class="masked-amount">••••</span>' : formatMoney(info.amountAbs));
  const entries = (state.currentEntries||[]).slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
  const entriesHtml = entries.length ? entries.map(e=>renderEntryRow(e,p,cur)).join('') : '<div class="empty-state" style="padding:36px 10px;"><p>'+t('noEntries')+'</p></div>';
  const timeline = computePersonTimeline(state.currentEntries||[]);
  const trendHtml = timeline.length>=2 ? ('<div class="trend-title">'+t('trendPersonTitle')+'</div>'+renderTrendChart(timeline)) : '';
  const avgDays = personAvgSettlementDays(state.currentEntries||[]);
  const avgText = avgDays===null ? t('notEnoughData') : (Math.round(avgDays)+t('daySuffix'));
  const lastRem = p.lastReminderAt ? formatDateShort(p.lastReminderAt) : t('neverReminded');
  return '<div class="hero person-hero">'
      +'<button class="back-btn" data-action="back">'+ICONS.arrowRight+' '+t('back')+'</button>'
      +'<div class="person-hero-name-row"><div class="person-hero-name">'+escapeHtml(p.name)+'</div></div>'
      +'<div class="person-hero-phone" dir="ltr">'+escapeHtml(p.phone)+'</div>'
      +'<div class="person-hero-badges">'
        +(p.pinned?'<span class="dir-badge">'+ICONS.pin+' '+t('pin')+'</span>':'')
        +'<span class="dir-badge">'+(dir==='by_me'?t('directionByMe'):t('directionToMe'))+'</span>'
        +(cur!==state.settings.currency ? '<span class="dir-badge">'+escapeHtml(cur)+'</span>' : '')
      +'</div>'
      +'<div class="person-hero-total '+info.cls+'">'+displayAmt+' <small>'+escapeHtml(cur)+'</small></div>'
      +'<div class="person-hero-total-label">'+info.label+'</div>'
      +'<div class="person-hero-extra">'+ICONS.clock+' '+t('avgSettlementLabel')+': '+avgText+' · '+t('lastReminderLabel')+lastRem+'</div>'
      +'<div class="person-hero-actions">'
        +'<button class="btn-debt" data-action="open-add-entry" data-type="debt" data-id="'+p.id+'">'+t('newDebt')+'</button>'
        +'<button class="btn-paid" data-action="open-add-entry" data-type="payment" data-id="'+p.id+'">'+t('recordPayment')+'</button>'
      +'</div>'
      +'<div class="person-hero-actions secondary">'
        +'<button class="btn-ghost" data-action="send-reminder" data-id="'+p.id+'">'+t('sendReminder')+'</button>'
        +'<button class="icon-btn-sm" data-action="print-statement" data-id="'+p.id+'" aria-label="'+t('printAria')+'">'+ICONS.print+'</button>'
        +'<button class="icon-btn-sm'+(p.pinned?' active':'')+'" data-action="toggle-pin" data-id="'+p.id+'" aria-label="'+(p.pinned?t('unpin'):t('pin'))+'">'+ICONS.pin+'</button>'

      +trendHtml

function renderEntryRow(e,p,currency){
  const isDebt = e.type==='debt';
  const instBadge = e.installmentId ? ('<span class="entry-badge badge-installment">'+t('installmentBadge')+' '+e.installmentIndex+'/'+e.installmentTotal+'</span>') : '';
  return '<div class="entry-row">'
    +'<div class="entry-date">'+formatDateLong(e.date)+'</div>'
    +'<div class="entry-main">'
      +'<span class="entry-badge '+(isDebt?'badge-debt':'badge-paid')+'">'+(isDebt?t('entryDebt'):t('entryPayment'))+'</span>'+instBadge
      +'<div><span class="entry-amount '+(isDebt?'text-debt':'text-paid')+'">'+(isDebt?'+':'−')+' '+fmtAmt(e.amount,currency)+'</span></div>'
      +(e.note?'<div class="entry-note">'+escapeHtml(e.note)+'</div>':'')
      +(isDebt && e.dueDate ? '<div class="entry-due">'+dueDateBadge(e.dueDate)+'</div>' : '')
      +(e.receiptImage ? '<div class="entry-receipt"><img src="'+e.receiptImage+'" alt="" data-action="view-image" data-src="'+encodeURIComponent(e.receiptImage)+'" /></div>' : '')
    +'</div>'
    +'<div class="entry-actions">'
      +'<button class="icon-btn-sm" data-action="edit-entry" data-id="'+e.id+'" data-person="'+p.id+'" aria-label="'+t('edit')+'">'+ICONS.pencil+'</button>'
      +'<button class="icon-btn-sm danger" data-action="delete-entry" data-id="'+e.id+'" data-person="'+p.id+'" aria-label="'+t('deleteWord')+'">'+ICONS.trash+'</button>'
    +'</div>'
  +'</div>';
}

        +'<button class="btn-danger" data-action="'+m.confirmAction+'" data-id="'+(m.confirmId||'')+'" data-person="'+(m.confirmPerson||'')+'">'+escapeHtml(m.confirmLabel||t('save'))+'</button>'
        +'<button class="btn-ghost" data-action="close-modal">'+t('cancel')+'</button>'
      +'</div>';
  } else if(m.type==='legal'){
    modalCls += ' modal-wide modal-legal';
    inner = renderLegalModal(m);
  } else if(m.type==='settings'){
    modalCls += ' modal-wide';
    inner = renderSettingsModal(m);
  } else if(m.type==='reports'){
    modalCls += ' modal-wide';
    inner = renderReportsModal(m);
  }
  return '<div class="overlay"><div class="'+modalCls+'" role="dialog" aria-modal="true">'+inner+'</div></div>';
}

function renderReportsModal(m){
  const period = m.period || 'month';
  const topN = m.topN || 5;
  const now = new Date();
  let rangeStart = null;
  if(period==='month') rangeStart = new Date(now.getFullYear(), now.getMonth(), 1);
  else if(period==='year') rangeStart = new Date(now.getFullYear(), 0, 1);
  const relevantEntries = state.allEntries.filter(e=>{
    const p = state.people.find(x=>x.id===e.personId);
    if(!p) return false;
    if(rangeStart && new Date(e.date) < rangeStart) return false;
    return true;
  });
  let added=0, paid=0;
  relevantEntries.forEach(e=>{ if(e.type==='debt') added+=Number(e.amount)||0; else paid+=Number(e.amount)||0; });
  const net = added-paid;
  const cur = state.settings.currency;
  const activeP = activePeople();
  const top = activeP.slice().sort((a,b)=> Math.abs(b.total||0)-Math.abs(a.total||0)).slice(0,topN).filter(p=>Math.abs(p.total||0)>0.005);
  const maxAbs = top.length ? Math.abs(top[0].total||0) : 1;
  const topRows = top.length ? top.map((p,i)=>{
    const c = personCurrency(p);
    return '<div class="report-list-row" data-action="open-person-from-modal" data-id="'+p.id+'">'
      +'<div class="report-rank">'+(i+1)+'</div>'
      +'<div class="report-list-main"><div class="report-list-name">'+escapeHtml(p.name)+'</div>'
        +renderBar(Math.abs(p.total||0)/maxAbs*100, (p.total||0)>0?'debt':'paid')
      +'</div>'
      +'<div class="report-list-sub" style="flex-shrink:0;">'+amountLabel(p.total||0,c)+'</div>'
    +'</div>';
  }).join('') : '<p class="modal-text">'+t('notEnoughData')+'</p>';
  const avgList = activeP.map(p=>({p, avg: personAvgSettlementDays(state.allEntries.filter(e=>e.personId===p.id))})).filter(x=>x.avg!==null);
  const overallAvg = avgList.length ? Math.round((avgList.reduce((s,x)=>s+x.avg,0)/avgList.length)*10)/10 : null;
  const avgRows = avgList.length ? avgList.sort((a,b)=>a.avg-b.avg).slice(0,10).map(x=>{
    return '<div class="report-list-row" data-action="open-person-from-modal" data-id="'+x.p.id+'">'
      +'<div class="report-list-main"><div class="report-list-name">'+escapeHtml(x.p.name)+'</div></div>'
      +'<div class="report-list-sub" style="flex-shrink:0;">'+Math.round(x.avg)+t('daySuffix')+'</div>'
    +'</div>';
  }).join('') : '<p class="modal-text">'+t('notEnoughData')+'</p>';
  return '<button class="modal-close" data-action="close-modal" aria-label="'+t('cancel')+'">×</button>'
    +'<h3 class="modal-title">'+t('reportsTitle')+'</h3>'
    +'<div class="seg-group">'
      +'<button type="button" class="seg-btn'+(period==='month'?' active':'')+'" data-action="set-report-period" data-value="month">'+t('periodThisMonth')+'</button>'
      +'<button type="button" class="seg-btn'+(period==='year'?' active':'')+'" data-action="set-report-period" data-value="year">'+t('periodThisYear')+'</button>'
      +'<button type="button" class="seg-btn'+(period==='all'?' active':'')+'" data-action="set-report-period" data-value="all">'+t('periodAll')+'</button>'
    +'</div>'
    +'<div class="stat-grid">'
      +'<div class="stat-card debt"><div class="stat-card-label">'+t('debtAdded')+'</div><div class="stat-card-value">'+fmtAmt(added,cur)+'</div></div>'
      +'<div class="stat-card paid"><div class="stat-card-label">'+t('paidBack')+'</div><div class="stat-card-value">'+fmtAmt(paid,cur)+'</div></div>'
      +'<div class="stat-card" style="grid-column:1/-1;"><div class="stat-card-label">'+t('netChange')+'</div><div class="stat-card-value '+(net>=0?'text-debt':'text-paid')+'">'+(net>=0?'+':'−')+' '+fmtAmt(Math.abs(net),cur)+'</div></div>'
    +'</div>'
    +'<hr class="modal-divider" />'
    +'<div class="entries-title-row"><span class="entries-title" style="margin:0;">'+t('topDebtorsTitle')+'</span>'
      +'<div class="seg-group" style="margin:0;">'

    +'</div>'
    +topRows
    +'<hr class="modal-divider" />'

/* ---------- Messages ---------- */
function buildMessage(kind, person, amount, remaining, currency, dueDate){
  const lang = curLang();
  const tone = state.settings.messageTone || 'friendly';
  const dir = person.direction || 'to_me';
  const cur = currency || state.settings.currency;
  const remAbs = formatMoney(Math.abs(remaining));
  const amtStr = formatMoney(amount);
  const name = person.name;
  const dueStr = dueDate ? formatDateLong(dueDate) : '';
  const settled = remaining<=0.005;
  return lang==='en'
    ? buildMessageEn(kind,name,amtStr,remAbs,cur,dueStr,tone,dir,settled)
    : buildMessageAr(kind,name,amtStr,remAbs,cur,dueStr,tone,dir,settled);
}
function buildMessageAr(kind,name,amtStr,remAbs,cur,dueStr,tone,dir,settled){
  const formal = tone==='formal';
  const hello = formal ? `السيد/ة ${name} المحترم/ة،` : `مرحباً ${name}،`;
  const bye = formal ? 'وتفضلوا بقبول فائق الاحترام.' : 'شكراً لك.';
  if(kind==='newDebt'){
    if(dir==='by_me'){
      return formal
        ? `${hello}\n\nنفيدكم بأنه تم تسجيل مبلغ ${amtStr} ${cur} كمبلغ مقترَض من حضرتكم.\nإجمالي المبلغ المستحق لكم لدينا حالياً: ${remAbs} ${cur}.\n\n${bye}`
        : `${hello}\n\nسجّلت مبلغ ${amtStr} ${cur} كاقتراض جديد منك.\nإجمالي المبلغ الذي أدين لك به الآن: ${remAbs} ${cur}.\n\n${bye}`;
    }
    return formal
      ? `${hello}\n\nنحيطكم علماً بتسجيل مبلغ بقيمة ${amtStr} ${cur} ضمن حسابكم لدينا.\nإجمالي الرصيد المستحق عليكم حالياً: ${remAbs} ${cur}.\n\n${bye}`
      : `${hello}\n\nتم تسجيل مبلغ جديد بقيمة ${amtStr} ${cur} على حسابك.\nإجمالي المبلغ المستحق عليك الآن: ${remAbs} ${cur}.\n\n${bye}`;
  }
  if(kind==='payment'){
    if(dir==='by_me'){
      if(settled) return formal
        ? `${hello}\n\nنفيدكم بأنه تم تحويل مبلغ ${amtStr} ${cur} إلى حضرتكم، وبذلك يكون قد تم سداد كامل المبلغ المستحق لكم.\n\nشاكرين لكم تفهمكم.`
        : `${hello}\n\nأرسلت لك دفعة بقيمة ${amtStr} ${cur}.\nبهذا أكون قد سددت كامل المبلغ الذي كنت أدين لك به، شكراً لتفهمك!`;
      return formal
        ? `${hello}\n\nنفيدكم بأنه تم تحويل مبلغ ${amtStr} ${cur} إلى حضرتكم.\nالمبلغ المتبقي المستحق لكم حالياً: ${remAbs} ${cur}.\n\n${bye}`
        : `${hello}\n\nأرسلت لك دفعة بقيمة ${amtStr} ${cur}.\nالمبلغ المتبقي الذي أدين لك به الآن: ${remAbs} ${cur}.\n\n${bye}`;
    }
    if(settled) return formal
      ? `${hello}\n\nنفيدكم باستلام دفعة بقيمة ${amtStr} ${cur}، وقد تم بموجبها سداد كامل المبلغ المستحق على حسابكم.\n\nشاكرين لكم حسن تعاملكم.`
      : `${hello}\n\nتم استلام دفعتك بقيمة ${amtStr} ${cur}.\nتم سداد كامل المبلغ المستحق عليك بالكامل، شكراً لك!`;
    return formal
      ? `${hello}\n\nنفيدكم باستلام دفعة بقيمة ${amtStr} ${cur}.\nالرصيد المتبقي على حسابكم حالياً: ${remAbs} ${cur}.\n\n${bye}`
      : `${hello}\n\nتم استلام دفعة بقيمة ${amtStr} ${cur}.\nالمبلغ المتبقي عليك الآن: ${remAbs} ${cur}.\n\n${bye}`;
  }
  if(kind==='reminder'){
    if(dir==='by_me'){
      return formal
        ? `${hello}\n\nنود إعلامكم بأننا ما زلنا مدينين لكم بمبلغ ${remAbs} ${cur}، وسيتم السداد في أقرب وقت ممكن.\n\nشاكرين لتفهمكم.`
        : `${hello}\n\nأحببت تذكيرك بأنني ما زلت أدين لك بمبلغ ${remAbs} ${cur} وسأقوم بسداده قريباً بإذن الله.\n\nشكراً لصبرك.`;
    }
    if(settled) return formal
      ? `${hello}\n\nنفيدكم بأن حسابكم لدينا مسدد بالكامل ولا يوجد أي مبلغ مستحق حالياً.\n\nشاكرين لكم.`
      : `${hello}\n\nحسابك مسدد بالكامل ولا يوجد عليك أي مبلغ مستحق حالياً. شكراً لك.`;
    return formal
      ? `${hello}\n\nنود تذكيركم بأن المبلغ المستحق على حسابكم لدينا هو ${remAbs} ${cur}.\nنرجو التكرم بالتواصل معنا بخصوص السداد في أقرب وقت ممكن.\n\n${bye}`
      : `${hello}\n\nتذكير بخصوص المبلغ المستحق عليك، وهو ${remAbs} ${cur}.\nنرجو التواصل بخصوص السداد في أقرب وقت ممكن.\n\n${bye}`;
  }
  if(kind==='dueReminder'){
    return formal
      ? `${hello}\n\nنود تذكيركم بأن مبلغ ${amtStr} ${cur} يستحق بتاريخ ${dueStr}.\nإجمالي المبلغ المستحق على حسابكم حالياً: ${remAbs} ${cur}.\n\nنرجو التكرم بالسداد في الموعد المحدد. ${bye}`
      : `${hello}\n\nتذكير بأن مبلغ ${amtStr} ${cur} يستحق بتاريخ ${dueStr}.\nإجمالي المبلغ المستحق عليك حالياً: ${remAbs} ${cur}.\n\nنرجو السداد في الموعد. ${bye}`;
  }
  return '';
}
function buildMessageEn(kind,name,amtStr,remAbs,cur,dueStr,tone,dir,settled){
  const formal = tone==='formal';
  const hello = formal ? `Dear ${name},` : `Hi ${name},`;
  const bye = formal ? 'Kind regards.' : 'Thanks!';
  if(kind==='newDebt'){
    if(dir==='by_me'){
      return formal
        ? `${hello}\n\nPlease be advised that an amount of ${cur} ${amtStr} borrowed from you has been recorded.\nThe total I currently owe you is: ${cur} ${remAbs}.\n\n${bye}`
        : `${hello}\n\nI've noted a new amount of ${cur} ${amtStr} I borrowed from you.\nTotal I owe you now: ${cur} ${remAbs}.\n\n${bye}`;
    }
    return formal
      ? `${hello}\n\nPlease be advised that an amount of ${cur} ${amtStr} has been recorded on your account.\nYour current outstanding balance is: ${cur} ${remAbs}.\n\n${bye}`
      : `${hello}\n\nA new amount of ${cur} ${amtStr} has been added to your account.\nYour total balance due is now: ${cur} ${remAbs}.\n\n${bye}`;
  }
  if(kind==='payment'){
    if(dir==='by_me'){
      if(settled) return formal
        ? `${hello}\n\nPlease be advised that a payment of ${cur} ${amtStr} has been sent to you, fully settling the amount owed.\n\n${bye}`
        : `${hello}\n\nI just sent you ${cur} ${amtStr}. That settles everything I owed you — thanks for your patience!`;
      return formal
        ? `${hello}\n\nPlease be advised that a payment of ${cur} ${amtStr} has been sent to you.\nThe remaining amount owed to you is: ${cur} ${remAbs}.\n\n${bye}`
        : `${hello}\n\nI just sent you ${cur} ${amtStr}.\nWhat I still owe you: ${cur} ${remAbs}.\n\n${bye}`;
    }
    if(settled) return formal
      ? `${hello}\n\nWe confirm receipt of your payment of ${cur} ${amtStr}. Your account balance has been fully settled.\n\n${bye}`
      : `${hello}\n\nGot your payment of ${cur} ${amtStr}. Your balance is now fully settled — thank you!`;
    return formal
      ? `${hello}\n\nWe confirm receipt of your payment of ${cur} ${amtStr}.\nYour remaining balance is: ${cur} ${remAbs}.\n\n${bye}`
      : `${hello}\n\nGot your payment of ${cur} ${amtStr}.\nRemaining balance: ${cur} ${remAbs}.\n\n${bye}`;
  }
  if(kind==='reminder'){
    if(dir==='by_me'){
      return formal
        ? `${hello}\n\nThis is to confirm that an amount of ${cur} ${remAbs} remains owed to you, which will be settled shortly.\n\n${bye}`
        : `${hello}\n\nJust a note that I still owe you ${cur} ${remAbs}. I'll settle it soon — thanks for your patience!`;
    }
    if(settled) return formal
      ? `${hello}\n\nWe confirm your account is fully settled with no outstanding balance.\n\n${bye}`
      : `${hello}\n\nYour account is fully settled — nothing due right now. Thanks!`;
    return formal
      ? `${hello}\n\nThis is a reminder that your outstanding balance is ${cur} ${remAbs}.\nKindly arrange payment at your earliest convenience.\n\n${bye}`
      : `${hello}\n\nJust a friendly reminder — you currently owe ${cur} ${remAbs}.\nPlease reach out about payment when you can.\n\n${bye}`;
  }
  if(kind==='dueReminder'){
    return formal
      ? `${hello}\n\nThis is a reminder that ${cur} ${amtStr} is due on ${dueStr}.\nYour current total balance is: ${cur} ${remAbs}.\n\nKindly ensure payment by the due date.\n\n${bye}`
      : `${hello}\n\nReminder: ${cur} ${amtStr} is due on ${dueStr}.\nYour current total balance is: ${cur} ${remAbs}.\n\nPlease settle by the due date. ${bye}`;
  }
  return '';
}
function normalizePhone(phone){
  let p = (phone||'').replace(/[^\d+]/g,'');
  if(p.startsWith('+')) p = p.slice(1);
  else if(p.startsWith('00')) p = p.slice(2);
  if(p.startsWith('0')) p = '962'+p.slice(1);
  else if(!p.startsWith('962') && p.length===9) p = '962'+p;
  return p;
}
async function logReminderSent(personId){
  const p = state.people.find(x=>x.id===personId);
  if(!p) return;
  p.lastReminderAt = new Date().toISOString();
  await storageSet('people', JSON.stringify(state.people));

/* ---------- Recurring processing ---------- */
async function processAllRecurring(){
  const todayIso = new Date().toISOString();
  let peopleChanged = false;
  for(const p of state.people){
    if(!p.recurring || !p.recurring.length) continue;
    let personEntries = null;
    for(const rule of p.recurring){
      if(!rule.active) continue;
      const dueDates = computeDueDatesForRule(rule, todayIso);
      if(dueDates.length===0) continue;
      if(personEntries===null){ personEntries = await loadEntries(p.id); }
      dueDates.forEach(d=>{
        personEntries.push({id:uid(), type:'debt', amount:Number(rule.amount)||0, note: rule.note ? rule.note : null, date:d, dueDate:null, recurringId:rule.id});
      });
      rule.lastRunDate = dueDates[dueDates.length-1];
      peopleChanged = true;
    }
    if(personEntries!==null){
      await saveEntries(p.id, personEntries);
      p.total = calcTotal(personEntries);
      state.allEntries = state.allEntries.filter(e=>e.personId!==p.id).concat(personEntries.map(e=>Object.assign({personId:p.id}, e)));
    }
  }
  if(peopleChanged){
    await storageSet('people', JSON.stringify(state.people));
  }
}

async function handleSaveInstallment(){
  const total = parseFloat(document.getElementById('instTotalInput').value);
  const count = parseInt(document.getElementById('instCountInput').value,10);
  if(!total || total<=0 || !count || count<2){ showToast(t('toastInstallmentInvalid'),'error'); return; }
  const interval = document.getElementById('instIntervalSelect').value;
  const customDays = parseInt(document.getElementById('instCustomDaysInput').value,10)||14;
  const note = document.getElementById('instNoteInput').value.trim();
  const startStr = document.getElementById('instStartInput').value;
  const startDate = startStr ? new Date(startStr+'T12:00:00') : new Date();
  const personId = state.modal.personId;
  const per = Math.floor((total/count)*100)/100;
  const amounts = new Array(count).fill(per);
  const remainder = Math.round((total - per*count)*100)/100;
  amounts[amounts.length-1] = Math.round((amounts[amounts.length-1]+remainder)*100)/100;
  const nowIso = new Date().toISOString();
  const instId = uid();
  const newEntries = amounts.map((amt,i)=>{
    let due = new Date(startDate);
    if(interval==='monthly') due.setMonth(due.getMonth()+i);
    else if(interval==='weekly') due.setDate(due.getDate()+i*7);
    else due.setDate(due.getDate()+i*customDays);
    return {id:uid(), type:'debt', amount:amt, note:note||null, date:nowIso, dueDate:due.toISOString(), installmentId:instId, installmentIndex:i+1, installmentTotal:count};
  });
  let entries = state.currentEntries.slice().concat(newEntries);
  await saveEntries(personId, entries);
  state.currentEntries = entries;
  state.allEntries = state.allEntries.filter(e=>e.personId!==personId).concat(entries.map(e=>Object.assign({personId}, e)));
  const p = state.people.find(x=>x.id===personId);
  if(p){ p.total = calcTotal(entries); await storageSet('people', JSON.stringify(state.people)); }
  state.modal = null;
  render();
}

async function handleUnlock(){
  const pwInput = document.getElementById('unlockPasswordInput');
  const errEl = document.getElementById('unlockError');
  if(state.lock.lockedUntil && new Date(state.lock.lockedUntil) > new Date()){
    if(errEl) errEl.textContent = t('lockedOutMsg');
    return;
  }
  const pw = pwInput.value;
  const hash = await hashPassword(pw);
  if(hash === state.lock.hash){
    state.lock.failedAttempts = 0; state.lock.lockedUntil = null;
    await storageSet('lock', JSON.stringify(state.lock));
    state.locked = false;
    await loadMainData();
    resetAutoLockTimer();
  } else {
    state.lock.failedAttempts = (state.lock.failedAttempts||0)+1;
    if(state.lock.failedAttempts>=5){
      state.lock.lockedUntil = new Date(Date.now()+30000).toISOString();
      state.lock.failedAttempts = 0;
    }
    await storageSet('lock', JSON.stringify(state.lock));
    if(errEl) errEl.textContent = (state.lock.lockedUntil && new Date(state.lock.lockedUntil)>new Date()) ? t('lockedOutMsg') : t('wrongPassword');
    pwInput.value = '';
    pwInput.focus();
  }
}

async function doImport(){
  const data = pendingImportData;
  if(!data){ state.modal=null; render(); return; }
  for(const p of state.people){ await storageDelete('entries:'+p.id); }
  const newPeople = [];
  const newAllEntries = [];
  for(const p of data.people){
    const id = p.id || uid();
    const entries = Array.isArray(p.entries) ? p.entries.map(en=>({
      id:en.id||uid(), type:en.type==='payment'?'payment':'debt', amount:Number(en.amount)||0,
      note:en.note||'', date:en.date||new Date().toISOString(), dueDate:en.dueDate||null,
      receiptImage:en.receiptImage||null, installmentId:en.installmentId||null,
      installmentIndex:en.installmentIndex||null, installmentTotal:en.installmentTotal||null,
      recurringId:en.recurringId||null
    })) : [];
    const total = calcTotal(entries);
    const recurring = Array.isArray(p.recurring) ? p.recurring : [];
    newPeople.push({id, name:p.name||'', phone:p.phone||'', total, createdAt:p.createdAt||new Date().toISOString(),
      recurring, pinned:!!p.pinned, archived:!!p.archived, direction:p.direction==='by_me'?'by_me':'to_me',
      currency:p.currency||null, lastReminderAt:p.lastReminderAt||null});
    await saveEntries(id, entries);
    entries.forEach(e=> newAllEntries.push(Object.assign({personId:id}, e)));
  }
  state.people = newPeople;
  state.allEntries = newAllEntries;
  await storageSet('people', JSON.stringify(state.people));
  if(data.settings){
    state.settings = Object.assign({}, DEFAULT_SETTINGS, state.settings, data.settings);
    await storageSet('settings', JSON.stringify(state.settings));
  }
  await processAllRecurring();
  pendingImportData = null;
  state.modal = null;
  state.view = 'list';
  state.currentPersonId = null;
  state.search = '';
  state.showArchived = false;
  render();
  showToast(t('toastImportSuccess'), 'success');
}
async function doWipeAll(){
  for(const p of state.people){ await storageDelete('entries:'+p.id); }
  await storageDelete('people');
  await storageDelete('settings');
  await storageDelete('lock');
  if(autoLockTimer) clearTimeout(autoLockTimer);
  state.people = [];
  state.allEntries = [];
  state.settings = Object.assign({},DEFAULT_SETTINGS);
  state.lock = {enabled:false, hash:'', biometricId:null, failedAttempts:0, lockedUntil:null};
  state.locked = false;
  state.view = 'list';
  state.currentPersonId = null;
  state.modal = null;
  state.search = '';
  state.showArchived = false;
  render();
}

function helpNorm(s){
  return String(s||"").toLowerCase()
    .replace(/[\u064B-\u065F\u0670\u0640]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .replace(/[^a-z0-9\u0600-\u06FF\s]/g," ").replace(/\s+/g," ").trim();
}
function helpStrip(w){ return w.length>3 && w.indexOf("ال")===0 ? w.slice(2) : w; }
let helpKeysReady = false;
function helpPrepare(){
  if(helpKeysReady) return;
  HELP_TOPICS.forEach(function(tp){ tp._k = tp.keys.map(helpNorm).filter(Boolean); });
  helpKeysReady = true;
}
function helpLang(){ return curLang()==="en" ? "en" : "ar"; }
function helpTopic(id){ return HELP_TOPICS.find(function(x){ return x.id===id; }); }
function helpChipsFor(ids, lang){ const L = lang || helpLang(); return ids.map(function(id){ const tp = helpTopic(id); return tp ? {label:tp[L].title, q:tp[L].title} : null; }).filter(Boolean); }

function helpLocal(text){
  helpPrepare();
  const L = /[\u0600-\u06FF]/.test(text) ? "ar" : (/[a-z]/i.test(text) ? "en" : helpLang()), ui = HELP_UI[L];
  const exact = HELP_TOPICS.find(function(tp){ return tp.ar.title===text || tp.en.title===text; });
  let best = exact || null, bestScore = exact ? 99 : 0;
  if(!exact){
    const q = helpNorm(text);
    const toks = q.split(" ").map(helpStrip);
    HELP_TOPICS.forEach(function(tp){
      let sc = 0;
      tp._k.forEach(function(k){
        const kw = k.split(" ");
        if(q.indexOf(k) !== -1){ sc += 2 + kw.length*1.5 + (k===q ? 1 : 0); }
        else if(kw.length>1 && kw.every(function(w){ return toks.indexOf(helpStrip(w))!==-1; })){ sc += 1.5 + kw.length; }
      });
      if(sc > bestScore){ bestScore = sc; best = tp; }
    });
    if(bestScore < 3){
      if(/^(مرحبا|مرحبتين|اهلا|اهلين|هلا|هلا والله|سلام|السلام عليكم|صباح الخير|مساء الخير|hi|hello|hey)\b/.test(q)) return {text:ui.hello, chips:helpChipsFor(HELP_START, L)};
      if(/شكرا|يعطيك العافيه|مشكور|تسلم|يسلمو|thanks|thank you|thx/.test(q)) return {text:ui.thanks, chips:helpChipsFor(HELP_START, L)};
      if(/من انت|مين انت|شو انت|ايش انت|who are you|what are you|what can you do|شو بتعمل|ماذا تفعل/.test(q)) return {text:ui.who, chips:helpChipsFor(HELP_START, L)};
      return {text:ui.fallback, chips:helpChipsFor(HELP_START, L).concat([{label:ui.more, more:true}])};
    }
  }
  return {text:best[L].a, chips:helpChipsFor(best.next||[], L)};
}

function helpSystemPrompt(){
  const L = helpLang();
  const manual = HELP_TOPICS.map(function(tp){ return tp[L].title+"\n"+tp[L].a.replace(/[«»]/g,'"'); }).join("\n\n");
  return (L==="en"
    ? "You are the built-in help assistant of the web app “Hisbet Arab” (a debt ledger). Answer only questions about using this app, briefly and in numbered steps when useful, in the user's language. If something is not in the manual, say you don't know instead of inventing features.\n\nMANUAL:\n"
    : "أنت مساعد المساعدة المدمج في تطبيق «حِسبة عَرَب» (دفتر ديون). أجب فقط عن أسئلة استخدام التطبيق بإيجاز وبخطوات مرقّمة عند الحاجة وبلغة المستخدم. وإن لم تجد الجواب في الدليل فقل إنك لا تعرف ولا تخترع ميزات.\n\nالدليل:\n") + manual;
}
async function helpAnswer(text){
  if(AI_CONFIG.endpoint){
    try{
      const ctrl = new AbortController(); const to = setTimeout(function(){ ctrl.abort(); }, 20000);
      const history = HELP.msgs.slice(-10).map(function(m){ return {role: m.role==="user" ? "user" : "assistant", content: m.text}; });
      const r = await fetch(AI_CONFIG.endpoint, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({system: helpSystemPrompt(), messages: history, lang: helpLang()}), signal: ctrl.signal});
      clearTimeout(to);
      if(r.ok){ const j = await r.json(); if(j && typeof j.reply==="string" && j.reply.trim()) return {text:j.reply.trim().slice(0,4000), chips:[]}; }
    }catch(_){}
  }
  return helpLocal(text);
}

/* ---- UI ---- */
const HELP = { open:false, busy:false, msgs:[], lang:null, els:{} };
function helpFmt(text){
  const body = function(x){ return escapeHtml(x).replace(/«([^»]+)»/g,"<b>$1</b>"); };
  let out = "", ol = false;
  String(text).split("\n").forEach(function(line){
    const m = line.match(/^\s*(\d+)\.\s+(.*)$/);
    if(m){ if(!ol){ out += "<ol>"; ol = true; } out += "<li>"+body(m[2])+"</li>"; }
    else { if(ol){ out += "</ol>"; ol = false; } if(line.trim()) out += "<p>"+body(line)+"</p>"; }
  });
  return out + (ol ? "</ol>" : "");
}
function helpScroll(){ const m = HELP.els.msgs; if(m) m.scrollTop = m.scrollHeight; }
function helpAdd(role, text){
  HELP.msgs.push({role:role, text:text});
  const d = document.createElement("div");
  d.className = "help-msg " + (role==="user" ? "user" : "bot");
  d.setAttribute("dir","auto");
  if(role==="user") d.textContent = text; else d.innerHTML = helpFmt(text);
  HELP.els.msgs.appendChild(d); helpScroll();
}
function helpTyping(on){
  const m = HELP.els.msgs, ex = m.querySelector(".help-typing");
  if(on && !ex){ const d = document.createElement("div"); d.className = "help-typing"; d.setAttribute("aria-hidden","true"); d.innerHTML = "<i></i><i></i><i></i>"; m.appendChild(d); helpScroll(); }
  if(!on && ex) ex.remove();
}
function helpSetChips(list){
  const box = HELP.els.chips; box.innerHTML = "";
  list.forEach(function(c){
    const b = document.createElement("button"); b.type = "button"; b.className = "help-chip"; b.textContent = c.label; b.setAttribute("dir","auto");
    if(c.more) b.setAttribute("data-more","1"); else b.setAttribute("data-q", c.q);
    box.appendChild(b);
  });
  helpScroll();
}
function helpReset(){
  HELP.msgs = []; HELP.els.msgs.innerHTML = "";
  helpAdd("bot", HELP_UI[helpLang()].greet);
  helpSetChips(helpChipsFor(HELP_START).concat([{label:HELP_UI[helpLang()].more, more:true}]));
}
async function helpSend(raw){
  const text = String(raw||"").trim().slice(0,300);
  if(!text || HELP.busy) return;
  HELP.busy = true; HELP.els.send.disabled = true;
  helpAdd("user", text); helpSetChips([]); helpTyping(true);
  HELP.lastL = /[\u0600-\u06FF]/.test(text) ? "ar" : (/[a-z]/i.test(text) ? "en" : helpLang());
  const t0 = Date.now(); let res;
  try{ res = await helpAnswer(text); }catch(_){ res = helpLocal(text); }
  const wait = 600 - (Date.now()-t0); if(wait > 0) await new Promise(function(r){ setTimeout(r, wait); });
  helpTyping(false); helpAdd("bot", res.text); helpSetChips(res.chips || []);
  HELP.busy = false; HELP.els.send.disabled = false;
}
function helpOpen(){
  HELP.open = true; HELP.els.panel.hidden = false; HELP.els.root.classList.add("help-open");
  HELP.els.fab.setAttribute("aria-expanded","true"); helpScroll();
  setTimeout(function(){ try{ HELP.els.input.focus({preventScroll:true}); }catch(_){} }, 30);
}
function helpClose(){
  HELP.open = false; HELP.els.panel.hidden = true; HELP.els.root.classList.remove("help-open");
  HELP.els.fab.setAttribute("aria-expanded","false"); try{ HELP.els.fab.focus({preventScroll:true}); }catch(_){}
}
function helpApplyLang(){
  const E = HELP.els; if(!E.root) return;
  const L = helpLang(), ui = HELP_UI[L];

function fxCommands(){
  const defs = [
    {label:t("addPerson").replace(/^\s*\+\s*/,""), sel:'[data-action="open-add-person"]'},
    {label:t("reportsAria"), sel:'[data-action="open-reports"]'},
    {label:t("archiveAria"), sel:'[data-action="enter-archive"]'},

    {label:t("lockNowAria"), sel:'[data-action="lock-now"]'}

}
function fxBuildItems(q){
  const ui = FX_UI[fxLang()], nq = helpNorm(q), toks = nq ? nq.split(" ") : [], dg = fxDigits(q);
  const people = [];
  (state.people||[]).forEach(function(p){
    const nm = helpNorm(p.name), ph = fxDigits(p.phone);
    let ok = true, starts = 0;
    toks.forEach(function(tk){ if(nm.indexOf(tk)===-1 && !(dg.length>=2 && ph.indexOf(dg)!==-1)) ok = false; });
    if(toks.length && nm.indexOf(toks[0])===0) starts = 1;
    if(ok) people.push({kind:"person", id:p.id, name:p.name, phone:p.phone||"", p:p, rank:(p.pinned?2:0)+starts+(p.archived?-3:0)});
  });
  people.sort(function(a,b){ return b.rank-a.rank || String(a.name).localeCompare(String(b.name), fxLang()); });
  const cmds = fxCommands().filter(function(c){ return !nq || helpNorm(c.label).indexOf(nq)!==-1; }).map(function(c){ return {kind:"cmd", label:c.label, sel:c.sel}; });
  return {people: people.slice(0, nq ? 9 : 7), cmds: cmds, ui: ui};
}
function fxAmount(p){

}

const app = document.getElementById('app');

app.addEventListener('click', async function(e){
  if(e.target.classList && e.target.classList.contains('overlay')){
    pendingReceiptData = null;
    state.modal = null; render(); return;
  }
  if(e.target.classList && e.target.classList.contains('image-viewer-overlay')){
    state.viewingImage = null; render(); return;
  }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(GUEST_BLOCKED_ACTIONS.has(action) && isGuest()){
    showToast(t('guestActionBlocked'), 'error');
    return;
  }
  switch(action){
    case 'open-person':
      state.currentPersonId = el.dataset.id;
      state.view = 'person';
      state.modal = null;
      state.currentEntries = await loadEntries(el.dataset.id);
      render();
      revalidateEntries(el.dataset.id);
      break;
    case 'open-person-from-modal':
      state.modal = null;
      state.currentPersonId = el.dataset.id;
      state.view = 'person';
      state.showArchived = false;
      state.currentEntries = await loadEntries(el.dataset.id);
      render();
      break;
    case 'back':
      state.view='list'; state.currentPersonId=null; state.currentEntries=[]; render();
      break;
    case 'open-add-person':
      state.modal = {type:'person', autofocus:'personNameInput'}; render();
      break;
    case 'edit-person':
      state.modal = {type:'person', editId:el.dataset.id, autofocus:'personNameInput'}; render();
      break;
    case 'delete-person':
      state.modal = {type:'confirm', title:t('deletePersonTitle'), text:t('deletePersonText'), confirmAction:'do-delete-person', confirmId:el.dataset.id, confirmLabel:t('deleteForever')};
      render();
      break;
    case 'do-delete-person':
      await doDeletePerson(el.dataset.id);
      break;
    case 'open-legal':
      { const ei = document.getElementById('authEmailInput'); if(ei) state.authEmailDraft = ei.value; }
      state.modal = {type:'legal', doc: el.dataset.doc==='terms' ? 'terms' : 'privacy'};
      try{ history.replaceState(null,'','#'+state.modal.doc); }catch(_){}
      render();
      break;
    case 'close-legal':
      state.modal = null; render();
      break;
    case 'close-modal':
      pendingReceiptData = null;
      state.modal = null; render();
      break;
    case 'save-person':
      await handleSavePerson();
      break;
    case 'save-entry':
      await handleSaveEntry();
      break;
    case 'trigger-receipt-upload':
      { const fi = document.getElementById('receiptFileInput'); if(fi) fi.click(); }
      break;
    case 'remove-receipt':
      await handleRemoveReceipt();
      break;
    case 'view-image':
      state.viewingImage = decodeURIComponent(el.dataset.src||'');
      render();
      break;
    case 'close-image-viewer':
      state.viewingImage = null; render();
      break;
    case 'open-add-installment':
      state.modal = {type:'installment', personId:el.dataset.id, autofocus:'instTotalInput'}; render();
      break;
    case 'save-installment':
      await handleSaveInstallment();
      break;
    case 'save-recurring':
      await handleSaveRecurring();
      break;
    case 'unlock-attempt':
      await handleUnlock();
      break;
    case 'unlock-biometric':
      await handleUnlockBiometric();
      break;
    case 'sort':
      state.sort = el.dataset.value; render();
      break;
    case 'toggle-pin':
      await togglePin(el.dataset.id);
      break;
    case 'archive-person':
      await setArchived(el.dataset.id, true);
      break;
    case 'unarchive-person':
      await setArchived(el.dataset.id, false);
      break;
    case 'enter-archive':
      state.showArchived = true; state.search=''; render();
      break;
    case 'exit-archive':
      state.showArchived = false; state.search=''; render();
      break;
    case 'toggle-hide-amounts':
    case 'toggle-hide-amounts-switch':
      await toggleHideAmounts();
      break;
    case 'open-reports':
      state.modal = {type:'reports', period:'month', topN:5}; render();
      break;
    case 'set-report-period':
      if(state.modal) state.modal.period = el.dataset.value; render();
      break;
    case 'set-report-topn':
      if(state.modal) state.modal.topN = parseInt(el.dataset.value,10); render();
      break;
    case 'open-add-entry':
      pendingReceiptData = null;
      state.modal = {type:'entry', entryType:el.dataset.type, personId:el.dataset.id, autofocus:'entryAmountInput'};
      render();
      break;
    case 'edit-entry':
      pendingReceiptData = null;
      state.modal = {type:'entry', editId:el.dataset.id, personId:el.dataset.person, autofocus:'entryAmountInput'};
      render();
      break;
    case 'delete-entry':
      state.modal = {type:'confirm', title:t('deleteEntryTitle'), text:t('deleteEntryText'), confirmAction:'do-delete-entry', confirmId:el.dataset.id, confirmPerson:el.dataset.person, confirmLabel:t('deleteAction')};
      render();
      break;
    case 'do-delete-entry':
      await doDeleteEntry(el.dataset.person, el.dataset.id);
      break;
    case 'send-reminder':
      openReminderMessage(el.dataset.id);
      break;
    case 'send-due-reminder':
      openDueReminderMessage(el.dataset.person, el.dataset.entry);
      break;
    case 'set-message-tone':
      await setMessageTone(el.dataset.value);
      break;
    case 'send-whatsapp':
      openWhatsApp(el.dataset.phone, document.getElementById('msgTextArea').value);
      await logReminderSent(el.dataset.person);
      break;
    case 'send-sms':
      openSMS(el.dataset.phone, document.getElementById('msgTextArea').value);
      await logReminderSent(el.dataset.person);
      break;
    case 'copy-message':
      { const ok = await copyToClipboard(document.getElementById('msgTextArea').value);
        showToast(ok ? t('toastCopied') : t('toastCopyFailed'), ok?'success':'error');
        if(ok) await logReminderSent(el.dataset.person); }
      break;
    case 'print-statement':
      await printStatement(el.dataset.id);
      break;
    case 'open-add-recurring':
      state.modal = {type:'recurring', personId:el.dataset.id, autofocus:'recurringAmountInput'};
      render();
      break;
    case 'toggle-recurring':
      await doToggleRecurring(el.dataset.person, el.dataset.id);
      break;
    case 'delete-recurring':
      state.modal = {type:'confirm', title:t('deleteRecurringTitle'), text:t('deleteRecurringText'), confirmAction:'do-delete-recurring', confirmId:el.dataset.id, confirmPerson:el.dataset.person, confirmLabel:t('deleteAction')};
      render();
      break;
    case 'do-delete-recurring':
      await doDeleteRecurring(el.dataset.person, el.dataset.id);
      break;
    case 'open-settings':
      state.modal = {type:'settings', changingPassword:false}; render();
      break;
    case 'open-settings-backup':
      state.modal = {type:'settings', changingPassword:false}; render();
      break;
    case 'dismiss-backup-banner':
      state.backupBannerDismissedAt = new Date().toISOString(); render();
      break;
    case 'save-settings':
      await doSaveSettings();
      break;
    case 'set-theme':
      await setTheme(el.dataset.value);
      break;
    case 'set-lang':
      await setLang(el.dataset.value);
      break;
    case 'save-autolock':
      await saveAutoLockMinutes();
      break;
    case 'enable-biometric':
      await handleEnableBiometric();
      break;
    case 'disable-biometric':
      await handleDisableBiometric();
      break;
    case 'toggle-backup-reminder':
      await toggleBackupReminder();
      break;
    case 'toggle-password-form':
      if(state.modal){ state.modal.changingPassword = !state.modal.changingPassword; }
      render();
      break;
    case 'enable-lock':
      await handleEnableLock();
      break;
    case 'disable-lock':
      await handleDisableLock();
      break;
    case 'lock-now':
      state.locked = true; state.modal = null; render();
      break;
    case 'forgot-password':
      state.modal = {type:'confirm', title:t('forgotTitle'), text:t('forgotText'), confirmAction:'do-forgot-password', confirmLabel:t('forgotConfirmLabel')};
      render();
      break;
    case 'do-forgot-password':
      state.lock = {enabled:false, hash:'', biometricId:null, failedAttempts:0, lockedUntil:null};
      await storageSet('lock', JSON.stringify(state.lock));
      state.locked = false;
      state.modal = null;
      await loadMainData();
      break;
    case 'sign-in-google':
      await signInWithGoogle();
      break;
    case 'sign-in-guest':
      await signInAsGuest();
      break;
    case 'auth-email-submit':
      await handleAuthEmailSubmit();
      break;
    case 'auth-forgot-password':
      await handleAuthForgotPassword();
      break;
    case 'auth-toggle-mode':
      state.authMode = (state.authMode==='signup') ? 'login' : 'signup';
      state.authError = null;
      renderSignInGate();
      break;
    case 'sign-out':
      await signOutUser();
      break;
    case 'export-data':
      await exportData();
      break;
    case 'export-csv':
      await exportCSV();
      break;
    case 'export-excel':
      await exportExcel();
      break;
    case 'share-backup':
      await shareBackup();
      break;
    case 'trigger-import':
      document.getElementById('importFileInput').click();
      break;
    case 'confirm-wipe':
      state.modal = {type:'confirm', title:t('wipeTitle'), text:t('wipeText'), confirmAction:'do-wipe', confirmLabel:t('wipeConfirmLabel')};
      render();
      break;
    case 'do-wipe':
      await doWipeAll();
      break;
    case 'do-import':
      await doImport();
      break;
  }
});

app.addEventListener('input', function(e){
  if(e.target && e.target.dataset && e.target.dataset.bind==='search'){
    captureFocus();
    state.search = e.target.value;
    render();
  }
});

app.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target.tagName==='INPUT'){
    const container = e.target.closest('.modal, .lock-card');
    if(container){
      const btn = container.querySelector('[data-action^="save-"], [data-action="unlock-attempt"], [data-action="auth-email-submit"]');
      if(btn){ e.preventDefault(); btn.click(); }
    }
  }
});

app.addEventListener('keydown', function(e){
  if((e.key==='Enter' || e.key===' ') && e.target && e.target.matches && e.target.matches('.person-row,.due-row')){
    e.preventDefault(); e.target.click();
  }
});

app.addEventListener('change', async function(e){
  if(e.target && e.target.id==='importFileInput'){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const text = await file.text();
    await handleImport(text);
    e.target.value = '';
  }
  if(e.target && e.target.id==='receiptFileInput'){
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(file) await handleReceiptFile(file);
  }
  if(e.target && e.target.id==='instIntervalSelect'){
    const customInput = document.getElementById('instCustomDaysInput');
    if(customInput) customInput.style.display = e.target.value==='custom' ? 'block' : 'none';
  }
});

document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    if(state.viewingImage){ state.viewingImage=null; render(); return; }
    if(state.modal){ pendingReceiptData=null; state.modal=null; render(); }
  }
});

document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='hidden' && state.lock && state.lock.enabled && !state.locked){
    state.locked = true;
    state.modal = null;
    render();
  }
});

/* ---------- Init ---------- */
async function loadMainData(){
  const peopleRaw = await storageGet('people');
  state.people = peopleRaw ? JSON.parse(peopleRaw) : [];
  state.people.forEach(p=>{
    if(!Array.isArray(p.recurring)) p.recurring=[];
    if(typeof p.pinned!=='boolean') p.pinned=false;
    if(typeof p.archived!=='boolean') p.archived=false;
    if(p.direction!=='by_me') p.direction='to_me';
    if(p.currency===undefined) p.currency=null;
    if(p.lastReminderAt===undefined) p.lastReminderAt=null;
  });
  const settingsRaw = await storageGet('settings');
  const savedSettings = settingsRaw ? JSON.parse(settingsRaw) : {};
  state.settings = Object.assign({}, DEFAULT_SETTINGS, savedSettings);
  const entryLists = await Promise.all(state.people.map(function(p){ return loadEntries(p.id); }));
  state.allEntries = [];
  state.people.forEach(function(p, i){
    entryLists[i].forEach(function(e){ state.allEntries.push(Object.assign({personId:p.id}, e)); });
  });
  await processAllRecurring();
  state.loading = false;
  render();
  resetAutoLockTimer();
}
async function init(){
  const lockRaw = await storageGet('lock');
  const savedLock = lockRaw ? JSON.parse(lockRaw) : {};
  state.lock = Object.assign({enabled:false, hash:'', biometricId:null, failedAttempts:0, lockedUntil:null}, savedLock);
  if(state.lock.enabled){
    state.locked = true;
    state.loading = false;
    render();
    return;
  }
  await loadMainData();
}

auth.onAuthStateChanged(function(user){
  if(user){
    state.currentUser = {uid:user.uid, name:user.displayName||'', email:user.email||'', photo:user.photoURL||'', isAnonymous:!!user.isAnonymous};
    state.authError = null;
    state.authMode = 'login';
    init().then(legalFromHash);
  } else {
    state.currentUser = null;
    state.loading = true;
    state.view = 'list';
    state.currentPersonId = null;
    state.modal = null;
    state.locked = false;
    renderSignInGate();
    legalFromHash();
  }
});
</script>

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js').catch(function(e){ console.info('SW registration skipped', e && e.message); });
  });
}
</script>
